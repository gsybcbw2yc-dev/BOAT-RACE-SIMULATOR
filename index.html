r(--line);border-radius:10px;min-width:0}.metric span{display:block;font-size:.72rem;color:var(--muted)}.metric strong{font-size:clamp(.95rem,4vw,1.4rem);overflow-wrap:anywhere}.race-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:7px}.race{display:flex;align-items:center;justify-content:space-between;text-align:left;gap:8px;background:#112b3c}.race b{font-size:1.05rem}.race span{display:block;color:var(--muted);font-size:.78rem}.tag{display:inline-block;padding:3px 8px;border-radius:99px;background:#233e4c;color:#c5dbe3;font-size:.75rem}.actions{position:sticky;bottom:0;z-index:4;background:#0c1f2c;border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.actions button{flex:1;max-width:340px}.boats{display:grid;gap:6px}.boat{display:grid;grid-template-columns:38px minmax(108px,1.5fr) repeat(3,minmax(44px,.65fr));gap:5px;align-items:center;background:#0b1c29;border-radius:9px;padding:6px}.num{display:grid;place-items:center;height:32px;width:32px;border-radius:7px;font-weight:900;color:#101820}.boatname{font-size:.87rem;font-weight:700;overflow-wrap:anywhere}.boatname small{display:block;font-weight:400;color:var(--muted);font-size:.73rem}.boatstat{text-align:center;font-size:.86rem;font-variant-numeric:tabular-nums}.boatstat small{display:block;font-size:.65rem;color:var(--muted)}.tablewrap{overflow:auto;max-width:100%;max-height:350px}table{width:100%;border-collapse:collapse;font-size:.86rem;text-align:left}th,td{padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);position:sticky;top:0;background:var(--panel)}.progress{height:6px;background:#294354;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}.ticket{display:flex;align-items:center;gap:8px;justify-content:space-between;background:#0b1d2a;border-radius:9px;padding:8px}.ticket button{padding:6px 11px;min-height:34px}.field{display:grid;gap:4px;flex:1;min-width:100px}label{color:var(--muted);font-size:.83rem}select,input{min-width:0;width:100%}details summary{cursor:pointer;font-weight:700}canvas{width:100%;max-width:720px;display:block;margin:auto;background:#062f44;border-radius:10px}.tiny{font-size:.75rem}.result{font-size:2.25rem;font-weight:900;letter-spacing:.08em}.toast{position:fixed;left:12px;right:12px;bottom:82px;z-index:10;margin:auto;max-width:600px;padding:12px;background:#213d4a;border:1px solid var(--accent);border-radius:12px;box-shadow:0 6px 20px #0007}.hidden{display:none}.grade{color:var(--accent)}.muted{color:var(--muted)}.selected{border-color:var(--accent);color:var(--accent)}.help{line-height:1.65}.split{display:grid;grid-template-columns:1.1fr 1fr;gap:12px}.split>.panel{margin:0}.notice{padding:10px;border-left:3px solid var(--gold);background:#253139;border-radius:5px;font-size:.88rem}.finish{display:flex;gap:6px;flex-wrap:wrap}.finish .num{width:39px;height:39px}.model-line{display:grid;grid-template-columns:36px repeat(3,1fr);gap:6px;align-items:center;font-size:.8rem;text-align:center;padding:5px}.model-line .num{width:28px;height:28px}.chartbar{height:7px;background:#203d4b;border-radius:8px;overflow:hidden}.chartbar i{height:100%;display:block;background:var(--accent)}@media(max-width:700px){.split{grid-template-columns:1fr}.race-list{grid-template-columns:repeat(2,minmax(0,1fr))}.race{padding:9px;font-size:.85rem}.race b{font-size:.94rem}.boat{grid-template-columns:32px minmax(90px,1.4fr) repeat(3,minmax(34px,.6fr))}.boat .num{width:28px;height:28px}.panel{padding:11px}.metric{padding:8px 6px}}@media(max-width:355px){.race-list{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

<body><header><div class="brand"><small>RACING LAB / v0.1</small>BOAT RACE SIM</div><div class="row"><button id="homeBtn">ホーム</button><button id="statsBtn">戦績</button></div></header><main id="app"></main><div id="actions" class="actions" style="display:none"></div><div id="toast" class="toast hidden" role="status"></div><input type="file" id="dataFile" accept=".json,application/json" hidden><input type="file" id="saveFile" accept=".json,application/json" hidden>
<script>
'use strict';
// Core: deterministic generation, independent predictor, market and accounting.
const VERSION='0.1.0', MODEL='EXP-PL-0.1', INITIAL=100000, LOAN_LIMIT=100000, KEY='boat-sim-v1', N=[1,2,3,4,5,6];
const COLORS=['#fff','#30343b','#ef565d','#3b91e9','#f6ce43','#3cbe78'];
const VENUES=['','桐生','戸田','江戸川','平和島','多摩川','浜名湖','蒲郡','常滑','津','三国','びわこ','住之江','尼崎','鳴門','丸亀','児島','宮島','徳山','下関','若松','芦屋','福岡','唐津','大村'];
const TYPES={trifecta:['3連単',3,true],trio:['3連複',3,false],exacta:['2連単',2,true],quinella:['2連複',2,false],quinella_place:['拡連複',2,false],win:['単勝',1,true],place:['複勝',1,true]};
const COST={practice:0,normal:1000,hard:3000}, DIFFICULTY={practice:'練習',normal:'ノーマル',hard:'ハード'};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const sum=a=>a.reduce((x,y)=>x+y,0);const round=(v,d=2)=>Math.round(v*10**d)/10**d;
const hash=s=>{let h=2166136261;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0};
function rng(seed){let x=hash(seed);return()=>{x=(x+0x6D2B79F5)|0;let z=Math.imul(x^x>>>15,1|x);z^=z+Math.imul(z^z>>>7,61|z);return ((z^z>>>14)>>>0)/4294967296}}
const range=(r,a,b)=>a+(b-a)*r();const time=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;const jst=ms=>{let d=new Date(ms+9*3600000);return d.getUTCHours()*60+d.getUTCMinutes()};
function perm(n,arr=N,p=[]){return n===0?[p]:arr.flatMap(x=>perm(n-1,arr.filter(y=>y!==x),[...p,x]))}
const ALL3=perm(3);const comboKey=(type,a)=>{let b=[...a];if(!TYPES[type][2])b.sort((x,y)=>x-y);return b.join('-')};
const COMBOS=Object.fromEntries(Object.entries(TYPES).map(([k,[,n,ordered]])=>[k,[...new Set(perm(n).map(a=>comboKey(k,a)))]]));
function winners(type,finish){if(type==='quinella_place')return [[0,1],[0,2],[1,2]].map(a=>comboKey(type,a.map(i=>finish[i])));if(type==='place')return finish.slice(0,2).map(String);return [comboKey(type,finish.slice(0,TYPES[type][1]))]}
function pl(weights){let out=ALL3.map(a=>{let left=sum(weights),p=1;for(let n of a){p*=weights[n-1]/left;left-=weights[n-1]}return [a.join('-'),p]});return out.sort((a,b)=>b[1]-a[1])}
function marg(dist){let out=Array.from({length:6},()=>[0,0,0]);for(let [k,p] of dist)k.split('-').forEach((n,i)=>out[+n-1][i]+=p);return out}
function score(b,weather){let c=b.course||b.lane;let factors={course:[1.46,.5,.19,.05,-.22,-.47][c-1],skill:(b.win-5.2)*.32,motor:(b.motor-34)*.019,exhibit:(6.85-b.exhibit)*1.8,start:(Number.isFinite(b.averageST)?(.17-b.averageST)*4.0:0)-((b.flyingCount||0)*.08),local:((b.localWin||b.win)-b.win)*.09,wind:(weather.wind||0)*(.015*(c-3))};return {factors,score:sum(Object.values(factors))}}
function experimental(race){let ss=race.boats.map(b=>score(b,race.weather));let d=pl(ss.map(s=>Math.exp(s.score)));return {id:MODEL,distribution:d,details:ss.map(x=>x.factors),firstMark:ss.map((s,i)=>({lane:i+1,s:s.score+s.factors.start*.8})).sort((a,b)=>b.s-a.s).map(x=>x.lane)}}
const DEMO=Array.from({length:30},(_,i)=>({registrationNumber:null,name:`デモ選手 ${String(i+1).padStart(2,'0')}`,grade:['A1','A2','B1','B1','B2'][i%5],win:4.1+(i%13)*.29,averageST:.13+(i%7)*.013,flyingCount:i%9===0?1:0,nationalTop2:25+i%30,nationalTop3:40+i%30}));
function generateRace(seed,day,venue,no,minute,profiles,venueProfile){ let id=`sim/${seed}/${day}/${venue}/${no}`,r=rng(id+'/card'),pool=profiles.filter(p=>Number.isFinite(p.averageST)),weather={wind:Math.floor(range(r,0,7)),wave:Math.floor(range(r,1,6)),windDir:['追い風','向かい風','横風'][Math.floor(r()*3)]};let boats=N.map(lane=>{let p=pool.splice(Math.floor(r()*pool.length),1)[0];return {...p,lane,course:lane,localWin:round(clamp(p.win+range(r,-1.2,1.2),2,9)),motor:round(range(r,21,52)),motorNumber:Math.floor(range(r,10,81)),exhibit:round(range(r,6.65,7.05)),st:round(clamp(p.averageST+range(r,-.09,.09),.01,.36)).toFixed(2)}});let prior=[.53,.14,.12,.10,.07,.04],n=venueProfile?.n||0,venueBias=prior.map((p,i)=>clamp(Math.log(((venueProfile?.w?.[i]||0)+p*36)/(n+36)/p),-.65,.65));return {id,date:`DAY ${day}`,venue,no,minute,boats,weather,sim:true,venueBias,venueN:n}}
function outcome(race){if(!race.sim)return {finish:race.finish,technique:race.technique,payouts:race.payouts,actualST:race.actualST,firstMark:null};let r=rng(race.id+'/outcome-independent'),early=[],late=[];for(let b of race.boats){let c=b.course,st=clamp(b.averageST+range(r,-.12,.12),.01,.37);let latent=(b.win-5)*.24+(b.motor-35)*.025+(6.85-b.exhibit)*1.3;let base=[2.0,.75,.35,.12,-.17,-.45][c-1]+(race.venueBias?.[c-1]||0)+latent+(0.2-st)*5.5+(-Math.log(-Math.log(clamp(r(),.000001,.999999))))*.60;early.push({lane:b.lane,st,v:base});late.push({lane:b.lane,v:base*.78+latent*.45+(range(r,-.5,.5))*1.1})}let firstMark=early.sort((a,b)=>b.v-a.v).map(x=>x.lane),finish=late.sort((a,b)=>b.v-a.v).map(x=>x.lane);let win=finish[0],technique=win===1?'逃げ':win!==firstMark[0]?'抜き':win===2?'差し':r()>.5?'まくり':'まくり差し';return {finish,firstMark,technique,actualST:early.map(x=>({lane:x.lane,st:round(x.st),course:x.lane})),payouts:null}}
function market(race,tick){if(!race.sim)return {trifecta:Object.fromEntries(race.officialOdds)};let r=rng(race.id+'/market/'+tick);let dist=pl(race.boats.map(b=>Math.exp([1.7,.48,.10,-.10,-.22,-.3][b.lane-1]+(race.venueBias?.[b.lane-1]||0)*.6+(b.win-5)*.28+(b.motor-35)*.013+range(r,-.15,.15))));let maps={};for(let type of Object.keys(TYPES)){let p=Object.fromEntries(COMBOS[type].map(k=>[k,0]));for(let [key,val] of dist){let a=key.split('-').map(Number);for(let w of winners(type,a))p[w]+=val}maps[type]=Object.fromEntries(Object.entries(p).map(([k,v])=>[k,Math.max(1,Math.floor(.75/Math.max(v,.00001)*10)/10)]))}return maps}
function normalizePayouts(p){let out={};for(let t of Object.keys(TYPES))out[t]=Object.fromEntries((p[t]||[]).map(x=>[x.combination.split(/[-=]/).map(Number).sort(TYPES[t][2]?()=>0:(a,b)=>a-b).join('-'),x.amount]));return out}
function payoutMaps(race,result,odds){if(!race.sim)return normalizePayouts(result.payouts);return Object.fromEntries(Object.keys(TYPES).map(t=>[t,Object.fromEntries(winners(t,result.finish).map(k=>[k,Math.floor(odds[t][k]*100/10)*10]))]))}
function settle(tickets,pay){return tickets.reduce((v,t)=>v+(pay[t.type]?.[t.key]||0)*(t.amount/100),0)}
function newState(mode,kind,difficulty,seed=String(Date.now())){return {version:1,mode,kind,difficulty,seed,day:1,wallet:INITIAL,debt:0,negativeDays:0,clock:0,logs:[],days:[],gameOver:false,peak:INITIAL,drawdown:0,processed:[],replayIndex:0,expenses:0,interest:0}}
function net(s){return s.wallet-s.debt}function loss(s){return net(s)-INITIAL}function drawdown(s){s.peak=Math.max(s.peak,net(s));s.drawdown=Math.max(s.drawdown,s.peak-net(s))}function canBorrow(s){return loss(s)<0&&s.debt+10000<=LOAN_LIMIT&&!s.gameOver}
function borrow(s){if(!canBorrow(s))return false;s.wallet+=10000;s.debt+=10000;return true}
function repay(s){let x=Math.min(10000,s.debt,Math.max(0,s.wallet));if(x<=0)return false;s.wallet-=x;s.debt-=x;return true}
function closeDay(s){let fee=COST[s.difficulty],interest=Math.ceil(s.debt*.01);s.wallet-=fee;s.debt+=interest;s.expenses+=fee;s.interest+=interest;s.negativeDays=net(s)<0?s.negativeDays+1:0;drawdown(s);s.days.push({day:s.day,net:net(s),wallet:s.wallet,debt:s.debt,fee,interest});s.gameOver=s.negativeDays>=7;s.day++;s.clock=0;s.processed=[];s.replayIndex++}
function brier(dist,finish){let m=marg(dist);return sum(m.map((x,i)=>(x[0]-(i+1===finish[0]?1:0))**2))}
function validatePack(d){if(d?.schema!=='boat-simulator-data-v1'||!Array.isArray(d.races)||!Array.isArray(d.profiles)||d.profiles.length<6)throw Error('対応するデータパックではありません');let ids=new Set;for(let r of d.races){if(ids.has(r.id)||!Number.isFinite(r.deadline)||r.boats?.length!==6||!r.boats.every((b,i)=>b.lane===i+1&&typeof b.name==='string'&&[b.win,b.motor,b.exhibit].every(Number.isFinite)&&(b.averageST==null||Number.isFinite(b.averageST)))||r.finish?.length!==6||new Set(r.finish).size!==6||!r.finish.every(x=>N.includes(x))||r.baseline?.distribution?.length!==120||r.officialOdds?.length!==120||!(Date.parse(r.baseline.captured)<r.deadline)||!(Date.parse(r.oddsAt)<r.deadline)||!Object.keys(TYPES).every(t=>Array.isArray(r.payouts?.[t])))throw Error('無効なレース: '+r.id);ids.add(r.id);for(let rows of [r.baseline.distribution,r.officialOdds])if(new Set(rows.map(x=>x[0])).size!==120||!rows.every(x=>COMBOS.trifecta.includes(x[0])&&Number.isFinite(x[1])&&x[1]>=0))throw Error('買い目データが不正です');if(Math.abs(sum(r.baseline.distribution.map(x=>x[1]))-1)>1e-6)throw Error('確率合計が不正です')}if(!d.profiles.every(p=>typeof p.name==='string'&&Number.isFinite(p.win)&&(p.averageST==null||Number.isFinite(p.averageST))))throw Error('選手データが不正です');return d}
const Core={perm,COMBOS,TYPES,pl,marg,experimental,generateRace,outcome,market,payoutMaps,settle,newState,borrow,repay,closeDay,net,loss,brier,validatePack,winners};if(typeof module!=='undefined')module.exports=Core;
if(typeof document!=='undefined'){
let app=document.getElementById('app'),bar=document.getElementById('actions'),toastEl=document.getElementById('toast'),pack=null,saves={},s=null,race=null,tickets=[],tick=0,interval=null,raf=null,lastResult=null,currentModel='exp',view='home',toastTimer,selectedType='trifecta',selectedKey='',pred={};
const yen=x=>`${Math.round(x).toLocaleString('ja-JP')}円`, pct=x=>`${(100*x).toFixed(1)}%`, esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(t){toastEl.textContent=t;toastEl.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.add('hidden'),3000)}
let db=null;function persist(){try{if(s)saves[s.mode+'-'+s.kind]=s;if(db){let tx=db.transaction('save','readwrite');tx.objectStore('save').put(saves,'state');tx.onerror=()=>notify('保存エラー。セーブをエクスポートしてください。')}else localStorage.setItem(KEY,JSON.stringify(saves));return true}catch(e){notify('保存容量不足またはブラウザ制限。セーブをエクスポートしてください。');return false}}
try{saves=JSON.parse(localStorage.getItem(KEY)||'{}');let raw=localStorage.getItem(KEY+'-data');if(raw)pack=validatePack(JSON.parse(raw))}catch(e){notify('保存データを読み込めませんでした')}
function stop(){clearInterval(interval);interval=null;if(raf)cancelAnimationFrame(raf);raf=null}function screen(v,html,actions=''){stop();view=v;app.innerHTML=html;bar.innerHTML=actions;bar.style.display=actions?'flex':'none';window.scrollTo(0,0)}
const btn=(label,action,cls='',disabled=false)=>`<button type="button" data-action="${action}" class="${cls}" ${disabled?'disabled':''}>${label}</button>`;
function metrics(){return `<div class="metrics"><div class="metric"><span>所持金</span><strong>${yen(s.wallet)}</strong></div><div class="metric"><span>累計収支</span><strong class="${loss(s)<0?'warn':'accent'}">${loss(s)>=0?'+':''}${yen(loss(s))}</strong></div><div class="metric"><span>借金残高</span><strong class="${s.debt?'gold':''}">${yen(s.debt)}</strong></div></div>`}
function home(){s=null;race=null;tickets=[];screen('home',`<div class="hero"><div class="tag">VIRTUAL BANKROLL / NO REAL MONEY</div><h1>予想を磨く。<br>レースを読む。</h1><p class="sub">仮想資金で競艇を楽しみ、結果から学ぶシミュレーター。</p></div><div class="panel"><h2>プレイ開始</h2><div class="grid"><div class="panel"><h3>実戦モード</h3><p class="sub">AIの分析と確率を参考に投票します。</p><div class="stack">${btn('架空レース','start:assist:sim','primary')}${btn('実在レース','start:assist:real','',!pack?.races?.length)}</div></div><div class="panel"><h3>独立検証モード</h3><p class="sub">確定までAI予想を隠し、独立した予想を比較します。</p><div class="stack">${btn('架空レース','start:blind:sim','primary')}${btn('実在レース','start:blind:real','',!pack?.races?.length)}</div></div></div><p class="sub">難易度は新規ゲーム時に選択。4モードの戦績は別々に保存します。</p><label for="difficulty">難易度</label><select id="difficulty"><option value="practice">練習：生活費なし</option><option value="normal" selected>ノーマル：1日 1,000円</option><option value="hard">ハード：1日 3,000円</option></select></div><div class="panel"><h2>データ・セーブ管理</h2><p>${pack?`実在レース ${pack.races.length}件 / 実在選手プロフィール ${pack.profiles.length}件`:'データ未読み込み。架空プロフィールによるデモのみ利用できます。'}</p><div class="notice">実在モードは締切前の観測データ・結果を含む専用パックが必要です。実在選手の架空レースは実際の成績と区別します。</div><div class="row" style="margin-top:10px">${btn('レースデータを読み込む','data')}${btn('セーブを書き出す','export')}${btn('セーブを読み込む','import')}</div></div><div class="panel help"><h2>ルール</h2><p>初期資金10万円、架空の借入上限10万円。累計赤字時のみ1万円ずつ借入できます。就寝時に利息1%と生活費を引き、純資産が7日連続マイナスならゲームオーバー。</p><p class="sub">すべてゲーム内の仮想資金です。予測モデルは研究用であり、現実の予測性能を保証しません。</p></div>`)}
function start(mode,kind){let id=mode+'-'+kind;s=saves[id]||newState(mode,kind,document.getElementById('difficulty')?.value||'normal');if(!saves[id]&&kind==='sim'){s.profiles=pack?.profiles||null;s.venueProfiles=pack?.venueProfiles||{};}if(kind==='real'&&!pack?.races.length)return notify('データパックが必要です');persist();lobby()}
function racesDay(){if(s.kind==='real'){let dates=[...new Set(pack.races.map(r=>r.date))].sort(),date=dates[s.replayIndex];return pack.races.filter(r=>r.date===date).map(r=>({...r,sim:false,minute:jst(r.deadline)})).sort((a,b)=>a.minute-b.minute)}let p=s.profiles?.filter(p=>Number.isFinite(p.averageST)).length>=6?s.profiles:DEMO;let r=rng(s.seed+'/day/'+s.day),venues=[];while(venues.length<4){let n=Math.floor(range(r,1,25));if(!venues.includes(n))venues.push(n)}return venues.flatMap((v,i)=>Array.from({length:12},(_,j)=>generateRace(s.seed,s.day,v,j+1,600+j*34+i*5,p,s.venueProfiles?.[v]))).sort((a,b)=>a.minute-b.minute)}
function lobby(){race=null;tickets=[];let all=racesDay(),left=all.filter(r=>!s.processed.includes(r.id));let title=s.mode==='assist'?'実戦':'独立検証';let todays=s.logs.filter(x=>x.day===s.day);let html=`<div class="between"><div><div class="tag">${title} / ${s.kind==='sim'?'架空':'実在'} / ${DIFFICULTY[s.difficulty]}</div><h2 style="margin-top:6px">DAY ${s.day} ${s.clock?time(s.clock):'開始前'}</h2></div><div class="tag">${s.negativeDays}/7日 赤字純資産</div></div>${metrics()}<div class="panel"><div class="between"><h2>開催レース一覧</h2><span class="sub">残り ${left.length}R</span></div>${s.kind==='real'?'<div class="notice">実在リプレイは保存されたレースのみ。入力側の公開時刻は未独立検証です。オッズは3連単の単一観測のみ。</div>':`<p class="sub">${s.profiles?'実在選手プロフィールを使用 / 展示等は生成値':'デモ選手 / すべて生成値'}</p>`}<div class="race-list">${left.map((r,i)=>`<button class="race" data-action="race:${i}" ${s.gameOver?'disabled':''}><div><b>${VENUES[r.venue]} ${r.no}R</b><span>${r.sim?'架空':esc(r.date)}　締切 ${time(r.minute)}</span></div><span>選択</span></button>`).join('')||'<p class="sub">参加できるレースはありません。</p>'}</div></div><div class="panel"><h2>資金管理</h2><div class="row">${btn('借入 +10,000円','borrow','',!canBorrow(s))}${btn('返済 10,000円','repay','',s.debt<=0||s.wallet<=0)}${btn('戦績を見る','stats')}</div><p class="sub">純資産 ${yen(net(s))} / 本日処理 ${todays.length}R</p></div>${s.gameOver?'<div class="panel"><h2 class="warn">ゲームオーバー</h2><p>純資産が7日連続マイナスになりました。</p>'+btn('新規開始（要エクスポート）','reset','primary')+'</div>':''}${s.kind==='real'&&!all.length?'<div class="notice">読み込んだ実在レースをすべて終了しました。データを追加するまで新規レースはありません。</div>':''}`;screen('lobby',html,btn('ホーム','home')+btn('就寝・1日終了','sleep','primary',s.gameOver||s.kind==='real'&&!all.length));}
function boatColor(n){return `background:${COLORS[n-1]};color:${[2,3,4,6].includes(n)?'#fff':'#101820'}`}
function badge(n){return `<span class="num" style="${boatColor(n)}">${n}</span>`}
function raceHeader(){return `<div class="between"><div><div class="tag">${race.sim?'架空レース・シミュレーション':'実在リプレイ'}</div><h2 style="margin:6px 0 0">${VENUES[race.venue]} ${race.no}R / ${time(race.minute)}</h2></div>${btn('一覧','lobby')}</div><p class="sub">風 ${race.weather.wind??'—'}m・波 ${race.weather.wave??'—'}cm・${esc(race.weather.windDir||'')}${race.sim&&race.venueN?` / 場別補正の参考件数 ${race.venueN}R`:''}</p>${metrics()}`}
function boatTable(){return `<div class="boats">${race.boats.map(b=>`<div class="boat">${badge(b.lane)}<div class="boatname">${esc(b.name)} <span class="grade">${esc(b.grade)}</span><small>${esc(b.registrationNumber||'DEMO')} / ${b.course}コース</small></div><div class="boatstat">${b.win.toFixed(2)}<small>勝率</small></div><div class="boatstat">${b.motor.toFixed(1)}<small>M2連%</small></div><div class="boatstat">${b.exhibit.toFixed(2)}<small>展示</small></div></div>`).join('')}</div><details style="margin-top:9px"><summary>詳細出走表</summary><div class="tablewrap"><table><thead><tr><th>艇</th><th>平均ST</th><th>展示ST</th><th>当地勝率</th><th>F</th><th>モーター</th></tr></thead><tbody>${race.boats.map(b=>`<tr><td>${b.lane}</td><td>${esc(b.averageST)}</td><td>${esc(b.st)}</td><td>${esc(b.localWin)}</td><td>${esc(b.flyingCount)}</td><td>${esc(b.motorNumber)}</td></tr>`).join('')}</tbody></table></div></details>`}
function techniqueProb(dist){let w=marg(dist).map(a=>a[0]),profiles=[[.94,.01,.01,.01,.03],[0,.65,.23,.08,.04],[0,.25,.42,.28,.05],[0,.17,.46,.31,.06],[0,.14,.30,.47,.09],[0,.12,.23,.50,.15]],names=['逃げ','差し','まくり','まくり差し','抜き'];return names.map((k,j)=>[k,sum(w.map((p,i)=>p*profiles[i][j]))]).sort((a,b)=>b[1]-a[1])}function turnMap(order,boats){return `<svg viewBox="0 0 330 152" width="100%" role="img" aria-label="第1ターンマークの仮説展開図"><rect width="330" height="152" rx="12" fill="#0a4760"/><path d="M8 130 Q205 130 270 50 Q295 12 327 36" stroke="#8bccdc" stroke-width="2" stroke-dasharray="5 5" fill="none"/><circle cx="272" cy="62" r="10" fill="#e9b65f"/><text x="253" y="43" fill="white" font-size="11">1M</text>${order.map((n,i)=>{let x=246-i*36,y=76+i*10;return `<path d="M${x-15} ${y+5} L${x-34} ${y+8}" stroke="#bbebf3" opacity=".6" stroke-width="2"/><circle cx="${x}" cy="${y}" r="13" fill="${COLORS[n-1]}"/><text x="${x}" y="${y+4}" font-size="12" font-weight="bold" fill="${n===1||n===5?'#111':'#fff'}" text-anchor="middle">${n}</text>`}).join('')}</svg><div class="row" style="margin-top:8px">${boats.slice().sort((a,b)=>a.course-b.course).map(b=>`<span class="tag">${b.lane}艇 ST ${esc(b.st||'—')}</span>`).join('')}</div>`}function modelPanel(reveal){if(!reveal)return `<div class="panel"><h2>AI予想</h2><div class="notice">独立検証モード：投票・見送り確定後に公開します。</div></div>`;let e=experimental(race),base=race.baseline;let m=currentModel==='base'&&base?base:e,d=marg(m.distribution),top=m.distribution[0],odds=market(race,tick).trifecta;let f=e.details;return `<div class="panel"><div class="between"><h2>AI分析</h2><span class="tag">${esc(m.id)}</span></div><div class="row">${btn('実験モデル','model:exp',currentModel==='exp'?'selected':'')}${btn('既存V4（保存予測）','model:base',currentModel==='base'?'selected':'',!base)}</div><p class="sub">${currentModel==='base'&&base?'締切前の保存予測をそのまま表示':'説明可能な仮説モデル / 未検証・研究用'}</p><div class="between"><strong>本命 ${esc(top[0])}</strong><span class="accent">${pct(top[1])}</span></div><div class="model-line"><span>艇</span><span>1着</span><span>2着</span><span>3着</span></div>${d.map((v,i)=>`<div class="model-line">${badge(i+1)}${v.map(x=>`<div>${pct(x)}<div class="chartbar"><i style="width:${x*100}%"></i></div></div>`).join('')}</div>`).join('')}<details id="evDetails"><summary>3連単120通り・期待値</summary><div class="tablewrap"><table><thead><tr><th>買い目</th><th>確率</th><th>オッズ</th><th>期待回収倍率</th></tr></thead><tbody>${m.distribution.map(([k,p])=>`<tr><td>${k}</td><td>${pct(p)}</td><td data-market-key="${k}">${odds?.[k]?.toFixed(1)??'—'}</td><td data-ev-key="${k}" data-prob="${p}">${odds?.[k]?(p*odds[k]).toFixed(2):'—'}</td></tr>`).join('')}</tbody></table></div></details><details><summary>実験モデルの予測要因</summary><div class="tablewrap"><table><thead><tr><th>艇</th><th>コース</th><th>勝率</th><th>モーター</th><th>展示</th><th>ST</th><th>当地</th><th>風</th></tr></thead><tbody>${f.map((x,i)=>`<tr><td>${i+1}</td>${Object.values(x).map(v=>`<td>${v>=0?'+':''}${v.toFixed(2)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="sub">実験モデルの対数スコア寄与。既存V4の内部要因とは異なります。</p></details><div class="panel" style="margin-bottom:0"><h3>第1ターンマーク予測</h3>${turnMap(e.firstMark,race.boats)}<p class="sub">展開の仮説順序と展示ST。実在レースの第1M実測は未収録。</p><div class="row">${techniqueProb(e.distribution).map(([k,p])=>`<span class="tag">${k} ${pct(p)}</span>`).join('')}</div><p class="tiny muted">決まり手は仮説上の確率であり、未検証です。</p></div></div>`}
function openRace(i){let all=racesDay().filter(r=>!s.processed.includes(r.id));race=all[i];if(!race)return;tickets=[];tick=0;selectedType='trifecta';selectedKey='';currentModel='exp';pred={};raceView()}
function totalBet(){return sum(tickets.map(t=>t.amount))}function availableOdds(){return market(race,tick)}
function buyPanel(){let opts=COMBOS[selectedType];if(!opts.includes(selectedKey))selectedKey=opts[0];return `<div class="panel"><div class="between"><h2>舟券投票</h2><span id="oddsFlag" class="tag">${race.sim?'オッズ変動中':'保存オッズ'}</span></div>${race.sim?'':'<p class="sub">3連単以外の締切前オッズは未保存。購入可能ですが払戻はアーカイブ確定値で精算します。</p>'}<div class="row"><div class="field"><label>券種</label><select id="type">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${k===selectedType?'selected':''}>${v[0]}</option>`).join('')}</select></div><div class="field"><label>買い目</label><select id="combination">${opts.map(k=>`<option ${k===selectedKey?'selected':''}>${k}</option>`).join('')}</select></div><div class="field"><label>金額（100円単位）</label><input id="amount" type="number" value="100" min="100" step="100" inputmode="numeric"></div></div><div class="between" style="margin:10px 0"><span class="sub">現在オッズ <b id="selectedOdds" class="accent">—</b></span>${btn('追加','add','primary')}</div><div id="ticketList"></div><details id="oddsDetails" style="margin-top:12px"><summary>オッズ一覧（選択券種）</summary><div id="oddsTable" class="tablewrap"></div></details></div>`}
function predPanel(){return `<div class="panel"><details><summary>プレイヤー予想記録（任意）</summary><p class="sub">投票とは独立して記録できます。</p><div class="row"><div class="field"><label>3連単着順</label><select id="prediction"><option value="">未入力</option>${COMBOS.trifecta.map(k=>`<option ${pred.finish===k?'selected':''}>${k}</option>`).join('')}</select></div><div class="field"><label>決まり手</label><select id="technique"><option value="">未入力</option>${['逃げ','差し','まくり','まくり差し','抜き','恵まれ'].map(k=>`<option ${pred.technique===k?'selected':''}>${k}</option>`).join('')}</select></div><div class="field"><label>第1M先頭艇</label><select id="firstMark"><option value="">未入力</option>${N.map(k=>`<option ${String(pred.firstMark)===String(k)?'selected':''}>${k}</option>`).join('')}</select></div></div><label>予想メモ</label><textarea id="memo" maxlength="300" rows="2" style="width:100%">${esc(pred.memo||'')}</textarea></details></div>`}
function raceView(){screen('race',raceHeader()+`<div class="split" style="margin-top:12px"><div class="panel"><h2>出走表・展示</h2>${boatTable()}</div><div id="modelBox">${modelPanel(s.mode==='assist')}</div></div>`+buyPanel()+predPanel(),btn('見送り','skip')+btn('投票確定・レース開始','commit','primary',!tickets.length));syncOdds();if(race.sim)interval=setInterval(()=>{tick++;syncOdds()},2200)}
function syncOdds(){if(view!=='race')return;let odds=availableOdds(),a=document.getElementById('selectedOdds');if(!a)return;a.textContent=odds[selectedType]?.[selectedKey]?.toFixed(1)+'倍';if(!odds[selectedType]?.[selectedKey])a.textContent='未保存';document.getElementById('ticketList').innerHTML=tickets.map((t,i)=>`<div class="ticket"><span>${TYPES[t.type][0]} <b>${t.key}</b> <span class="sub">${odds[t.type]?.[t.key]?.toFixed(1)??'—'}倍</span></span><b>${yen(t.amount)}</b>${btn('削除','remove:'+i)}</div>`).join('')+`<div class="between" style="margin-top:8px"><span>購入合計</span><strong>${yen(totalBet())}</strong></div>`;let od=odds[selectedType];if(document.getElementById('oddsDetails')?.open)document.getElementById('oddsTable').innerHTML=od?`<table><thead><tr><th>買い目</th><th>オッズ</th></tr></thead><tbody>${Object.entries(od).sort((a,b)=>a[1]-b[1]).map(([k,v])=>`<tr><td>${k}</td><td>${v.toFixed(1)}</td></tr>`).join('')}</tbody></table>`:'<p class="sub">オッズ未保存</p>';if(document.getElementById('evDetails')?.open){document.querySelectorAll('[data-market-key]').forEach(el=>el.textContent=odds.trifecta?.[el.dataset.marketKey]?.toFixed(1)??'—');document.querySelectorAll('[data-ev-key]').forEach(el=>{let x=odds.trifecta?.[el.dataset.evKey];el.textContent=x?(x*Number(el.dataset.prob)).toFixed(2):'—'})}let c=bar.querySelector('[data-action="commit"]');if(c)c.disabled=!tickets.length||totalBet()>s.wallet}
function addTicket(){let amount=Number(document.getElementById('amount').value);if(!Number.isSafeInteger(amount)||amount<100||amount%100||amount+totalBet()>s.wallet)return notify('100円単位・所持金以内で入力してください');let t=tickets.find(x=>x.type===selectedType&&x.key===selectedKey);if(t)t.amount+=amount;else tickets.push({type:selectedType,key:selectedKey,amount});syncOdds()}
function lock(r,participation,ts=[],p={},od=market(r,0)){let exp=experimental(r),models=[exp,...(r.baseline?[r.baseline]:[])],result=outcome(r),pay=payoutMaps(r,result,od),stake=sum(ts.map(x=>x.amount)),ret=settle(ts,pay);if(stake>s.wallet)throw Error('残高不足');s.wallet+=ret-stake;drawdown(s);let log={id:r.id,day:s.day,venue:r.venue,no:r.no,kind:s.kind,mode:s.mode,status:participation,stake,return:ret,pnl:ret-stake,finish:result.finish,technique:result.technique,firstMark:result.firstMark,actualST:result.actualST,player:p,tickets:ts.map(t=>({...t,odds:od[t.type]?.[t.key]??null,return:(pay[t.type]?.[t.key]||0)*(t.amount/100)})),models:models.map(m=>({id:m.id,distribution:m.distribution,top:m.distribution[0][0],brier:brier(m.distribution,result.finish),firstMark:m.firstMark||null})),capturedBeforeReveal:true,lockedAt:new Date().toISOString(),oddsAt:r.sim?'simulated':r.oddsAt,source:r.sim?'generated':r.provenance};s.logs.push(log);s.processed.push(r.id);s.clock=Math.max(s.clock,r.minute);return {result,pay,log,models}}
function processEarlier(r){for(let x of racesDay())if(!s.processed.includes(x.id)&&x.minute<r.minute)lock(x,'auto-skip')}
function commit(skip){if(!race||s.processed.includes(race.id))return;let stake=totalBet();if(!skip&&(!stake||stake>s.wallet))return notify('舟券を追加してください');processEarlier(race);lastResult=lock(race,skip?'skip':'bet',skip?[]:tickets,{...pred},availableOdds());tickets=[];persist();resultView(true)}
function resultView(animate){let z=lastResult;let html=`<div class="between"><div><span class="tag">${race.sim?'架空レース':'実在リプレイ'}</span><h2>${VENUES[race.venue]} ${race.no}R</h2></div><span class="tag">${z.log.status==='bet'?'投票確定':'見送り'}</span></div>${animate?'<div class="notice">投票確定済み。レース終了後に収支を公開します。</div>':metrics()}<div class="panel"><div class="between"><h2>${animate?'レース観戦':'レース結果'}</h2>${animate?'<select id="speed" style="width:95px"><option value="1">等速</option><option value="2">2倍速</option><option value="4">4倍速</option></select>':''}</div>${animate?`<canvas id="water" width="720" height="320" aria-label="レースの模式アニメーション"></canvas><p id="phase" class="sub">スタート準備</p><p class="sub">${race.sim?'生成されたレースの模式表示':'実在の確定着順を使った推定再現。実際の航跡ではありません。'}</p>`:`<div class="finish">${z.result.finish.map(badge).join('')}</div><p class="result">${esc(z.result.finish.slice(0,3).join('-'))}</p><p>決まり手 <b>${esc(z.result.technique||'不明')}</b></p><div class="metrics"><div class="metric"><span>購入</span><strong>${yen(z.log.stake)}</strong></div><div class="metric"><span>払戻</span><strong>${yen(z.log.return)}</strong></div><div class="metric"><span>収支</span><strong class="${z.log.pnl<0?'warn':'accent'}">${yen(z.log.pnl)}</strong></div></div><div class="tablewrap"><table><thead><tr><th>券種</th><th>的中</th><th>100円払戻</th></tr></thead><tbody>${Object.entries(z.pay).flatMap(([t,m])=>Object.entries(m).map(([k,v])=>`<tr><td>${TYPES[t][0]}</td><td>${k}</td><td>${yen(v)}</td></tr>`)).join('')}</tbody></table></div>`}</div>`;if(!animate){html+=`<div class="panel"><h2>予想比較</h2>${z.models.map(m=>`<div class="between"><span>${esc(m.id)}</span><strong>${m.distribution[0][0]} ${m.distribution[0][0]===z.result.finish.slice(0,3).join('-')?'的中':'不的中'}</strong></div>`).join('')}<p class="sub">プレイヤー記録：${esc(z.log.player.finish||'未入力')} / ${esc(z.log.player.technique||'未入力')}</p></div>`+modelPanel(true)}screen('result',html,animate?btn('結果へスキップ','showResult','primary'):btn('次のレース一覧','lobby','primary'));if(animate)animateRace()}
function animateRace(){let canvas=document.getElementById('water'),ctx=canvas.getContext('2d'),start=performance.now(),elapsed=0,last=start,rank=lastResult.result.finish,early=lastResult.result.firstMark||rank,st=lastResult.result.actualST||[],W=canvas.width,H=canvas.height;function frame(now){if(view!=='result'||!document.getElementById('water'))return;let speed=Number(document.getElementById('speed')?.value||1);elapsed+=(now-last)*speed;last=now;let t=clamp(elapsed/11000,0,1);ctx.fillStyle='#0a4760';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#74b7c8';ctx.lineWidth=2;ctx.setLineDash([9,8]);ctx.beginPath();ctx.ellipse(360,160,260,105,0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);for(let x of [100,620]){ctx.fillStyle='#e9b65f';ctx.beginPath();ctx.arc(x,160,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='14px system-ui';ctx.fillText(x===620?'1M':'2M',x-9,136)}for(let n of N){let offset= t<.35?early.indexOf(n):rank.indexOf(n),gap=(offset*.038)*Math.min(t*3,1),angle=Math.PI+Math.max(0,t*6*Math.PI-gap)+(n-1)*.016;let x=360+Math.cos(angle)*(260+(n-3.5)*5),y=160+Math.sin(angle)*(101+(n-3.5)*3);ctx.strokeStyle='#c6edf955';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-12,y+2);ctx.stroke();ctx.fillStyle=COLORS[n-1];ctx.beginPath();ctx.arc(x,y,12,0,Math.PI*2);ctx.fill();ctx.fillStyle=n===1||n===5?'#111':'#fff';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText(n,x,y+4);ctx.textAlign='left'}document.getElementById('phase').textContent=t<.1?'スタート':t<.22?'第1ターンマーク':t<.66?'道中・順位変動':'最終周回';if(t<1)raf=requestAnimationFrame(frame);else resultView(false)}raf=requestAnimationFrame(frame)}
function sleep(){let all=racesDay();for(let r of all)if(!s.processed.includes(r.id))lock(r,'auto-skip');let d=s.day;closeDay(s);persist();let day=s.days.at(-1),logs=s.logs.filter(x=>x.day===d);screen('sleep',`<div class="hero"><div class="tag">DAY ${d} 終了</div><h1>本日の収支</h1></div>${metrics()}<div class="panel"><div class="between"><span>舟券収支</span><b>${yen(sum(logs.map(x=>x.pnl)))}</b></div><div class="between"><span>生活費</span><b>−${yen(day.fee)}</b></div><div class="between"><span>借金利息</span><b>−${yen(day.interest)}</b></div><div class="between"><span>純資産</span><b>${yen(day.net)}</b></div><p class="sub">純資産マイナス連続 ${s.negativeDays}/7日</p>${s.gameOver?'<h2 class="warn">ゲームオーバー</h2>':''}</div>`,btn(s.gameOver?'結果を確認':'翌日へ進む','lobby','primary'))}
function breakdown(logs){let venue=new Map,types=new Map;for(let x of logs){if(x.status!=='bet')continue;let a=venue.get(x.venue)||{n:0,stake:0,ret:0};a.n++;a.stake+=x.stake;a.ret+=x.return;venue.set(x.venue,a);for(let t of x.tickets){let v=types.get(t.type)||{n:0,stake:0,ret:0,missing:false};v.n++;v.stake+=t.amount;if(t.return==null)v.missing=true;else v.ret+=t.return;types.set(t.type,v)}}let tbl=(rows)=>`<div class="tablewrap"><table><thead><tr><th>分類</th><th>件数</th><th>購入</th><th>回収率</th></tr></thead><tbody>${rows.map(([k,v])=>`<tr><td>${k}</td><td>${v.n}</td><td>${yen(v.stake)}</td><td>${v.missing?'—':pct(v.ret/v.stake)}</td></tr>`).join('')}</tbody></table></div>`;let chosen=logs.filter(x=>x.status==='bet'),skip=logs.filter(x=>x.status!=='bet'),hit=x=>x.models[0]?.top===x.finish.slice(0,3).join('-');return `<details><summary>競艇場別・券種別・選別分析</summary><h3>競艇場別</h3>${tbl([...venue].map(([k,v])=>[VENUES[k],v]))}<h3>券種別</h3>${tbl([...types].map(([k,v])=>[TYPES[k][0],v]))}<h3>参加・非参加の実験モデル的中率</h3><p>参加 ${chosen.length?pct(chosen.filter(hit).length/chosen.length):'—'}（${chosen.length}R） / 非参加 ${skip.length?pct(skip.filter(hit).length/skip.length):'—'}（${skip.length}R）</p></details>`}function analytics(){let states=s?[s]:Object.values(saves),entries=states.flatMap(a=>a.logs),groups=Object.entries(saves);let html=`<div class="hero"><h1>戦績・研究</h1><p class="sub">架空・実在、実戦・独立検証を区別して集計します。</p></div>`;for(let [k,a] of groups){if(s&&a!==s)continue;let logs=a.logs,bets=logs.filter(x=>x.status==='bet'),stake=sum(bets.map(x=>x.stake)),ret=sum(bets.map(x=>x.return)),hits=bets.filter(x=>x.return>0).length;let ms=new Map;for(let x of logs)for(let m of x.models){let row=ms.get(m.id)||{n:0,hit:0,b:0};row.n++;row.hit+=m.top===x.finish.slice(0,3).join('-')?1:0;row.b+=m.brier;ms.set(m.id,row)}let player=logs.filter(x=>x.player?.finish),first=logs.filter(x=>x.player?.firstMark&&x.firstMark);html+=`<div class="panel"><h2>${k.includes('assist')?'実戦':'独立検証'} / ${k.includes('sim')?'架空':'実在'}</h2><div class="metrics"><div class="metric"><span>参加</span><strong>${bets.length}R</strong></div><div class="metric"><span>的中率</span><strong>${bets.length?pct(hits/bets.length):'—'}</strong></div><div class="metric"><span>回収率</span><strong>${stake?pct(ret/stake):'—'}</strong></div><div class="metric"><span>見送り・未選択</span><strong>${logs.length-bets.length}R</strong></div><div class="metric"><span>最大DD</span><strong>${yen(a.drawdown)}</strong></div><div class="metric"><span>舟券収支</span><strong>${yen(ret-stake)}</strong></div></div><p class="sub">プレイヤー3連単予想 ${player.length}件・的中 ${player.filter(x=>x.player.finish===x.finish.slice(0,3).join('-')).length}件 / 第1M検証 ${first.length}件・的中 ${first.filter(x=>Number(x.player.firstMark)===x.firstMark[0]).length}件</p><div class="tablewrap"><table><thead><tr><th>モデル</th><th>対象</th><th>3連単1位的中</th><th>1着 Brier</th></tr></thead><tbody>${[...ms].map(([id,m])=>`<tr><td>${esc(id)}</td><td>${m.n}</td><td>${pct(m.hit/m.n)}</td><td>${(m.b/m.n).toFixed(4)}</td></tr>`).join('')}</tbody></table></div>${breakdown(logs)}<details><summary>履歴・最新100件</summary><div class="tablewrap"><table><thead><tr><th>日</th><th>レース</th><th>参加</th><th>結果</th><th>収支</th></tr></thead><tbody>${logs.slice(-100).reverse().map(x=>`<tr><td>${x.day}</td><td>${VENUES[x.venue]} ${x.no}R</td><td>${x.status==='bet'?'購入':x.status==='skip'?'見送り':'未選択'}</td><td>${x.finish.slice(0,3).join('-')}</td><td>${yen(x.pnl)}</td></tr>`).join('')}</tbody></table></div></details></div>`}if(!entries.length)html+='<p class="sub">まだ記録がありません。</p>';screen('stats',html+`<div class="panel"><h2>研究データ</h2><div class="row">${btn('CSV出力','csv')}${btn('JSON出力','research')}</div><p class="sub">結果公開前に確定した予想分布、買い目、モード、モデルID、実データ出典を保存します。ブラウザ内のクライアント保存であり改ざん耐性はありません。</p></div>`,btn(s?'レース一覧へ':'ホーム','back','primary'))}
function download(name,data,mime='application/json'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportSave(){download('boat-simulator-save.json',JSON.stringify({schema:'boat-simulator-save-v1',saves},null,2))}
function exportResearch(csv){let logs=(s?[s]:Object.values(saves)).flatMap(x=>x.logs);if(!csv)return download('boat-research.json',JSON.stringify(logs));let header=['id','mode','kind','day','venue','race_no','status','stake','return','pnl','finish','player_prediction','model_ids','top_predictions','brier'];let content=[header,...logs.map(x=>[x.id,x.mode,x.kind,x.day,x.venue,x.no,x.status,x.stake,x.return,x.pnl,x.finish.join('-'),x.player?.finish||'',x.models.map(m=>m.id).join('|'),x.models.map(m=>m.top).join('|'),x.models.map(m=>m.brier).join('|')])].map(a=>a.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n');download('boat-research.csv','\ufeff'+content,'text/csv;charset=utf-8')}
document.getElementById('homeBtn').onclick=()=>home();document.getElementById('statsBtn').onclick=()=>analytics();
document.addEventListener('toggle',e=>{if(['evDetails','oddsDetails'].includes(e.target.id)&&e.target.open)syncOdds()},true);document.addEventListener('change',e=>{let id=e.target.id;if(id==='type'){selectedType=e.target.value;selectedKey=COMBOS[selectedType][0];document.getElementById('combination').innerHTML=COMBOS[selectedType].map(k=>`<option>${k}</option>`).join('');syncOdds()}else if(id==='combination'){selectedKey=e.target.value;syncOdds()}else if(id==='prediction')pred.finish=e.target.value;else if(id==='technique')pred.technique=e.target.value;else if(id==='firstMark')pred.firstMark=e.target.value});document.addEventListener('input',e=>{if(e.target.id==='memo')pred.memo=e.target.value});
document.getElementById('dataFile').onchange=async e=>{try{let d=validatePack(JSON.parse(await e.target.files[0].text()));if(Object.values(saves).some(x=>x.kind==='real'&&x.logs.length)&&pack&&JSON.stringify(pack.races.map(x=>x.id))!==JSON.stringify(d.races.map(x=>x.id)))throw Error('実在プレイ途中のデータ差し替えは未対応です。セーブを保存してください。');localStorage.setItem(KEY+'-data',JSON.stringify(d));pack=d;notify(`${d.races.length}レース・${d.profiles.length}選手を読み込みました`);home()}catch(err){notify(err.message)}e.target.value=''};
document.getElementById('saveFile').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(d.schema!=='boat-simulator-save-v1'||!d.saves||Object.entries(d.saves).some(([k,v])=>!['assist-sim','blind-sim','assist-real','blind-real'].includes(k)||v.version!==1||k!==v.mode+'-'+v.kind||!Number.isFinite(v.wallet)||!Number.isFinite(v.debt)||!Array.isArray(v.logs)||!Array.isArray(v.processed)||!Array.isArray(v.days)||!(v.difficulty in COST)||!Number.isInteger(v.day)))throw Error('セーブ形式が違います');if(!confirm('現在のセーブを読み込むファイルで置き換えますか？'))return;s=null;saves=d.saves;persist();home();notify('セーブ読み込み完了')}catch(err){notify(err.message)}finally{e.target.value=''}};
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(!el||el.disabled)return;let [a,b,c]=el.dataset.action.split(':');try{switch(a){case'home':home();break;case'start':start(b,c);break;case'lobby':lobby();break;case'back':s?lobby():home();break;case'race':openRace(+b);break;case'model':currentModel=b;if(view==='race')document.getElementById('modelBox').innerHTML=modelPanel(s.mode==='assist');else if(view==='result')resultView(false);break;case'add':addTicket();break;case'remove':tickets.splice(+b,1);syncOdds();break;case'commit':commit(false);break;case'skip':commit(true);break;case'showResult':resultView(false);break;case'sleep':sleep();break;case'borrow':if(borrow(s)){persist();lobby()}break;case'repay':if(repay(s)){persist();lobby()}break;case'stats':analytics();break;case'data':document.getElementById('dataFile').click();break;case'export':exportSave();break;case'import':document.getElementById('saveFile').click();break;case'csv':exportResearch(true);break;case'research':exportResearch(false);break;case'reset':if(confirm('現在のゲームをリセットしますか？研究記録は事前にエクスポートしてください。')){let old=s;s=newState(old.mode,old.kind,old.difficulty);if(s.kind==='sim'){s.profiles=pack?.profiles||null;s.venueProfiles=pack?.venueProfiles||{}}persist();lobby()}break}}catch(err){notify('処理できません：'+err.message)}});
function boot(){app.innerHTML='<div class="panel">セーブを読み込み中…</div>';if(!window.indexedDB)return home();try{let req=indexedDB.open(KEY,1);req.onupgradeneeded=()=>req.result.createObjectStore('save');req.onerror=()=>home();req.onblocked=()=>home();req.onsuccess=()=>{db=req.result;let q=db.transaction('save','readonly').objectStore('save').get('state');q.onsuccess=()=>{if(q.result&&typeof q.result==='object')saves=q.result;else persist();home()};q.onerror=()=>home()}}catch(e){home()}}
boot();
}
</script></body></html>
