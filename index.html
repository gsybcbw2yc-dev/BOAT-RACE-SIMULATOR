r(--line);border-radius:10px;min-width:0}.metric span{display:block;font-size:.72rem;color:var(--muted)}.metric strong{font-size:clamp(.95rem,4vw,1.4rem);overflow-wrap:anywhere}.race-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:7px}.race{display:flex;align-items:center;justify-content:space-between;text-align:left;gap:8px;background:#112b3c}.race b{font-size:1.05rem}.race span{display:block;color:var(--muted);font-size:.78rem}.tag{display:inline-block;padding:3px 8px;border-radius:99px;background:#233e4c;color:#c5dbe3;font-size:.75rem}.actions{position:sticky;bottom:0;z-index:4;background:#0c1f2c;border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.actions button{flex:1;max-width:340px}.boats{display:grid;gap:6px}.boat{display:grid;grid-template-columns:38px minmax(108px,1.5fr) repeat(3,minmax(44px,.65fr));gap:5px;align-items:center;background:#0b1c29;border-radius:9px;padding:6px}.num{display:grid;place-items:center;height:32px;width:32px;border-radius:7px;font-weight:900;color:#101820}.boatname{font-size:.87rem;font-weight:700;overflow-wrap:anywhere}.boatname small{display:block;font-weight:400;color:var(--muted);font-size:.73rem}.boatstat{text-align:center;font-size:.86rem;font-variant-numeric:tabular-nums}.boatstat small{display:block;font-size:.65rem;color:var(--muted)}.tablewrap{overflow:auto;max-width:100%;max-height:350px}table{width:100%;border-collapse:collapse;font-size:.86rem;text-align:left}th,td{padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);position:sticky;top:0;background:var(--panel)}.progress{height:6px;background:#294354;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}.ticket{display:flex;align-items:center;gap:8px;justify-content:space-between;background:#0b1d2a;border-radius:9px;padding:8px}.ticket button{padding:6px 11px;min-height:34px}.field{display:grid;gap:4px;flex:1;min-width:100px}label{color:var(--muted);font-size:.83rem}select,input{min-width:0;width:100%}details summary{cursor:pointer;font-weight:700}canvas{width:100%;max-width:720px;display:block;margin:auto;background:#062f44;border-radius:10px}.tiny{font-size:.75rem}.result{font-size:2.25rem;font-weight:900;letter-spacing:.08em}.toast{position:fixed;left:12px;right:12px;bottom:82px;z-index:10;margin:auto;max-width:600px;padding:12px;background:#213d4a;border:1px solid var(--accent);border-radius:12px;box-shadow:0 6px 20px #0007}.hidden{display:none}.grade{color:var(--accent)}.muted{color:var(--muted)}.selected{border-color:var(--accent);color:var(--accent)}.help{line-height:1.65}.split{display:grid;grid-template-columns:1.1fr 1fr;gap:12px}.split>.panel{margin:0}.notice{padding:10px;border-left:3px solid var(--gold);background:#253139;border-radius:5px;font-size:.88rem}.finish{display:flex;gap:6px;flex-wrap:wrap}.finish .num{width:39px;height:39px}.model-line{display:grid;grid-template-columns:36px repeat(3,1fr);gap:6px;align-items:center;font-size:.8rem;text-align:center;padding:5px}.model-line .num{width:28px;height:28px}.chartbar{height:7px;background:#203d4b;border-radius:8px;overflow:hidden}.chartbar i{height:100%;display:block;background:var(--accent)}@media(max-width:700px){.split{grid-template-columns:1fr}.race-list{grid-template-columns:repeat(2,minmax(0,1fr))}.race{padding:9px;font-size:.85rem}.race b{font-size:.94rem}.boat{grid-template-columns:32px minmax(90px,1.4fr) repeat(3,minmax(34px,.6fr))}.boat .num{width:28px;height:28px}.panel{padding:11px}.metric{padding:8px 6px}}@media(max-width:355px){.race-list{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
.bet-methods{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.bet-methods button{flex:1 1 auto;font-size:.88rem;padding:9px 11px}.bet-methods .selected{background:#1c514e;border-color:var(--accent);color:#d6fff5}.bet-matrix{display:grid;gap:5px;align-items:center;margin:10px 0}.bet-matrix-head{color:var(--muted);font-size:.82rem;text-align:center}.bet-name{display:flex;align-items:center;gap:6px;min-width:0;font-size:.82rem}.bet-name span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bet-name .num{flex:0 0 28px;width:28px;height:28px}.bet-pick{padding:5px;min-height:42px;text-align:center;font-size:.9rem;min-width:0;border-color:#335468}.bet-pick[aria-pressed="true"]{border:2px solid var(--accent);background:#1f574e;color:#d4fff5}.bet-pick[data-all="true"]{font-size:.8rem}.bet-tally{background:#0b1d2a;border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0}.bet-tally strong{color:var(--accent);font-size:1.15rem}.bet-amount{display:flex;align-items:end;flex-wrap:wrap;gap:8px}.bet-amount .field{max-width:180px}.bet-amount input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent)}.bet-check{display:flex;align-items:center;gap:5px;min-height:44px;font-size:.87rem}.bet-preview{max-height:245px;overflow:auto;border:1px solid var(--line);border-radius:9px;margin:9px 0}.bet-preview input{width:92px;padding:6px;min-height:36px}.bet-preview td:last-child{text-align:right}.bet-odds-list{max-height:285px;overflow:auto;border:1px solid var(--line);border-radius:9px}.bet-odds-list button{display:flex;align-items:center;justify-content:space-between;width:100%;border-radius:0;padding:8px 12px;border-width:0 0 1px;gap:8px;font-weight:600}.bet-odds-list button[aria-pressed="true"]{background:#1c514e;color:#d6fff5}.bet-cart{display:grid;gap:6px;max-height:335px;overflow:auto}.bet-cart-row{display:grid;grid-template-columns:minmax(90px,1fr) 95px 50px;gap:6px;align-items:center;background:#0b1d2a;padding:7px;border-radius:9px}.bet-cart-row input{min-height:40px;padding:6px}.bet-cart-row button{min-height:40px;padding:5px;font-size:.8rem}.bet-cart-row .sub{display:block;font-size:.77rem}.bet-total{font-weight:700;display:grid;gap:5px;font-variant-numeric:tabular-nums}.bet-total .between{font-size:.88rem}.bet-total .grand{font-size:1.2rem;color:var(--accent)}@media(max-width:380px){.bet-matrix{gap:4px}.bet-name{font-size:.73rem}.bet-pick{font-size:.8rem}.bet-cart-row{grid-template-columns:minmax(78px,1fr) 82px 46px;gap:4px}.bet-cart-row input{font-size:.88rem}.bet-methods button{padding:8px;font-size:.8rem}}
.race-hud{display:flex;align-items:center;gap:18px;background:#091d2a;border:1px solid var(--line);border-radius:10px;padding:9px 14px;margin:0 0 9px;font-variant-numeric:tabular-nums}.lap-count{font-size:2.15rem;line-height:1;font-weight:900;color:var(--accent)}.lap-count span{font-size:1.15rem;color:var(--muted)}.race-status{flex:1;min-width:0}.race-status strong{font-size:.94rem}.lap-track{display:flex;gap:5px;margin-top:6px}.lap-track i{height:5px;flex:1;border-radius:4px;background:#294354}.lap-track i.current{background:var(--gold)}.lap-track i.done{background:var(--accent)}.race-order{margin-top:10px;flex-wrap:wrap}.race-order .num{height:26px;width:26px;font-size:.87rem}.race-order .row{gap:4px}
.race-controls{display:flex;gap:5px;align-items:center}.race-controls select{width:auto;max-width:130px;font-size:.82rem;padding:9px 5px}.race-canvas{position:relative;max-width:720px;margin:auto}.camera-label{position:absolute;top:7px;left:8px;padding:3px 8px;font-size:.72rem;background:#061b2bce;border:1px solid #69aece66;border-radius:5px;color:#d9f1fc;pointer-events:none}.broadcast{display:flex;align-items:center;gap:7px;background:#0b1f2d;border:1px solid var(--line);padding:9px;border-radius:9px;margin-top:8px;min-height:46px}.broadcast strong{flex:1;font-size:.89rem}.broadcast .sub{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.72rem}.start-times{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:8px 0}.start-times:empty{display:none}.start-time{display:flex;align-items:center;justify-content:center;gap:3px;font-size:.78rem;background:#0b1f2d;padding:5px 1px;border-radius:5px;font-variant-numeric:tabular-nums}.start-time .num{width:20px;height:20px;font-size:.73rem;border-radius:4px}.race-details{margin:10px 0 15px}.race-details .num{width:22px;height:22px;font-size:.78rem}@media(max-width:390px){.race-controls select{font-size:.73rem;max-width:104px;padding:6px 4px}.broadcast strong{font-size:.8rem}.start-time{font-size:.7rem}.start-time .num{width:17px;height:17px}.race-hud{gap:10px;padding:8px 10px}}

<body><header><div class="brand"><small>RACING LAB / v0.6.0</small>BOAT RACE SIM</div><div class="row"><button id="homeBtn">ホーム</button><button id="statsBtn">戦績</button></div></header><main id="app"></main><div id="actions" class="actions" style="display:none"></div><div id="toast" class="toast hidden" role="status"></div><input type="file" id="dataFile" accept=".json,application/json" hidden><input type="file" id="saveFile" accept=".json,application/json" hidden>
<script src="core.js"></script>
<script>
'use strict';
if(typeof document!=='undefined'){
let app=document.getElementById('app'),bar=document.getElementById('actions'),toastEl=document.getElementById('toast'),pack=null,saves={},s=null,race=null,tickets=[],tick=0,interval=null,raf=null,lastResult=null,currentModel='exp',view='home',toastTimer,selectedType='trifecta',pred={};
const METHODS={normal:'通常投票',formation:'フォーメーション',box:'ボックス',flow:'流し',odds:'オッズ投票'};
let betMethod='normal',groups=[],oddsKeys=new Set,oddsOrder=[],uniformAmount='100',individual=false,individualAmounts={};
const yen=x=>`${Math.round(x).toLocaleString('ja-JP')}円`, pct=x=>`${(100*x).toFixed(1)}%`, esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(t){toastEl.textContent=t;toastEl.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.add('hidden'),3000)}
let db=null;function persist(){try{if(s)saves[s.mode+'-'+s.kind]=s;if(db){let tx=db.transaction('save','readwrite');tx.objectStore('save').put(saves,'state');tx.onerror=()=>notify('保存エラー。セーブをエクスポートしてください。')}else localStorage.setItem(KEY,JSON.stringify(saves));return true}catch(e){notify('保存容量不足またはブラウザ制限。セーブをエクスポートしてください。');return false}}
try{saves=JSON.parse(localStorage.getItem(KEY)||'{}');let raw=localStorage.getItem(KEY+'-data');if(raw)pack=validatePack(JSON.parse(raw))}catch(e){notify('保存データを読み込めませんでした')}
function stop(){clearInterval(interval);interval=null;if(raf)cancelAnimationFrame(raf);raf=null}function screen(v,html,actions=''){stop();view=v;app.innerHTML=html;bar.innerHTML=actions;bar.style.display=actions?'flex':'none';window.scrollTo(0,0)}
const btn=(label,action,cls='',disabled=false)=>`<button type="button" data-action="${action}" class="${cls}" ${disabled?'disabled':''}>${label}</button>`;
function metrics(){return `<div class="metrics"><div class="metric"><span>所持金</span><strong>${yen(s.wallet)}</strong></div><div class="metric"><span>累計収支</span><strong class="${loss(s)<0?'warn':'accent'}">${loss(s)>=0?'+':''}${yen(loss(s))}</strong></div><div class="metric"><span>借金残高</span><strong class="${s.debt?'gold':''}">${yen(s.debt)}</strong></div></div>`}
function home(){s=null;race=null;tickets=[];screen('home',`<div class="hero"><div class="tag">VIRTUAL BANKROLL / NO REAL MONEY</div><h1>予想を磨く。<br>レースを読む。</h1><p class="sub">仮想資金で競艇を楽しみ、結果から学ぶシミュレーター。</p></div><div class="panel"><h2>プレイ開始</h2><div class="grid"><div class="panel"><h3>実戦モード</h3><p class="sub">AIの分析と確率を参考に投票します。</p><div class="stack">${btn('架空レース','start:assist:sim','primary')}${btn('実在レース','start:assist:real','',!pack?.races?.length)}</div></div><div class="panel"><h3>独立検証モード</h3><p class="sub">確定までAI予想を隠し、独立した予想を比較します。</p><div class="stack">${btn('架空レース','start:blind:sim','primary')}${btn('実在レース','start:blind:real','',!pack?.races?.length)}</div></div></div><p class="sub">難易度は新規ゲーム時に選択。4モードの戦績は別々に保存します。</p><label for="difficulty">難易度</label><select id="difficulty"><option value="practice">練習：生活費なし</option><option value="normal" selected>ノーマル：1日 1,000円</option><option value="hard">ハード：1日 3,000円</option></select></div><div class="panel"><h2>AI研究ラボ / PC推奨</h2><p class="sub">架空レースのQ学習・自動実行。通常プレイと分離し、未使用の架空レースで固定戦略と比較します。</p><a href="research.html" class="primary lab-link">研究ラボを開く</a></div><div class="panel"><h2>データ・セーブ管理</h2><p>${pack?`実在レース ${pack.races.length}件 / 実在選手プロフィール ${pack.profiles.length}件`:'データ未読み込み。架空プロフィールによるデモのみ利用できます。'}</p><div class="notice">実在モードは締切前の観測データ・結果を含む専用パックが必要です。実在選手の架空レースは実際の成績と区別します。</div><div class="row" style="margin-top:10px">${btn('レースデータを読み込む','data')}${btn('セーブを書き出す','export')}${btn('セーブを読み込む','import')}</div></div><div class="panel help"><h2>ルール</h2><p>初期資金10万円、架空の借入上限10万円。累計赤字時のみ1万円ずつ借入できます。就寝時に利息1%と生活費を引き、純資産が7日連続マイナスならゲームオーバー。</p><p class="sub">すべてゲーム内の仮想資金です。予測モデルは研究用であり、現実の予測性能を保証しません。</p></div>`)}
function start(mode,kind){let id=mode+'-'+kind;s=saves[id]||newState(mode,kind,document.getElementById('difficulty')?.value||'normal');if(!saves[id]&&kind==='sim'){s.profiles=pack?.profiles||null;s.venueProfiles=pack?.venueProfiles||{};}if(kind==='real'&&!pack?.races.length)return notify('データパックが必要です');persist();lobby()}
function racesDay(){if(s.kind==='real'){let dates=[...new Set(pack.races.map(r=>r.date))].sort(),date=dates[s.replayIndex];return pack.races.filter(r=>r.date===date).map(r=>({...r,sim:false,minute:jst(r.deadline)})).sort((a,b)=>a.minute-b.minute)}let p=s.profiles?.filter(p=>Number.isFinite(p.averageST)).length>=6?s.profiles:DEMO;let r=rng(s.seed+'/day/'+s.day),venues=[];while(venues.length<4){let n=Math.floor(range(r,1,25));if(!venues.includes(n))venues.push(n)}return venues.flatMap((v,i)=>Array.from({length:12},(_,j)=>generateRace(s.seed,s.day,v,j+1,600+j*34+i*5,p,s.venueProfiles?.[v]))).sort((a,b)=>a.minute-b.minute)}
function lobby(){race=null;tickets=[];let all=racesDay(),left=all.filter(r=>!s.processed.includes(r.id));let title=s.mode==='assist'?'実戦':'独立検証';let todays=s.logs.filter(x=>x.day===s.day);let html=`<div class="between"><div><div class="tag">${title} / ${s.kind==='sim'?'架空':'実在'} / ${DIFFICULTY[s.difficulty]}</div><h2 style="margin-top:6px">DAY ${s.day} ${s.clock?time(s.clock):'開始前'}</h2></div><div class="tag">${s.negativeDays}/7日 赤字純資産</div></div>${metrics()}<div class="panel"><div class="between"><h2>開催レース一覧</h2><span class="sub">残り ${left.length}R</span></div>${s.kind==='real'?'<div class="notice">実在リプレイは保存されたレースのみ。入力側の公開時刻は未独立検証です。オッズは3連単の単一観測のみ。</div>':`<p class="sub">${s.profiles?'実在選手プロフィールを使用 / 展示等は生成値':'デモ選手 / すべて生成値'}</p>`}<div class="race-list">${left.map((r,i)=>`<button class="race" data-action="race:${i}" ${s.gameOver?'disabled':''}><div><b>${VENUES[r.venue]} ${r.no}R</b><span>${r.sim?'架空':esc(r.date)}　締切 ${time(r.minute)}</span></div><span>選択</span></button>`).join('')||'<p class="sub">参加できるレースはありません。</p>'}</div></div><div class="panel"><h2>資金管理</h2><div class="row">${btn('借入 +10,000円','borrow','',!canBorrow(s))}${btn('返済 10,000円','repay','',s.debt<=0||s.wallet<=0)}${btn('戦績を見る','stats')}</div><p class="sub">純資産 ${yen(net(s))} / 本日処理 ${todays.length}R</p></div>${s.gameOver?'<div class="panel"><h2 class="warn">ゲームオーバー</h2><p>純資産が7日連続マイナスになりました。</p>'+btn('新規開始（要エクスポート）','reset','primary')+'</div>':''}${s.kind==='real'&&!all.length?'<div class="notice">読み込んだ実在レースをすべて終了しました。データを追加するまで新規レースはありません。</div>':''}`;screen('lobby',html,btn('ホーム','home')+btn('就寝・1日終了','sleep','primary',s.gameOver||s.kind==='real'&&!all.length));}
function boatColor(n){return `background:${COLORS[n-1]};color:${[2,3,4,6].includes(n)?'#fff':'#101820'}`}
function badge(n){return `<span class="num" style="${boatColor(n)}">${n}</span>`}
function raceHeader(){return `<div class="between"><div><div class="tag">${race.sim?'架空レース・シミュレーション':'実在リプレイ'}</div><h2 style="margin:6px 0 0">${VENUES[race.venue]} ${race.no}R / ${time(race.minute)}</h2></div>${btn('一覧','lobby')}</div><p class="sub">風 ${race.weather.wind??'—'}m・波 ${race.weather.wave??'—'}cm・${esc(race.weather.windDir||'')}${race.sim&&race.venueN?` / 場別補正の参考件数 ${race.venueN}R`:''}</p>${metrics()}`}
function boatTable(){return `<div class="boats">${race.boats.map(b=>`<div class="boat">${badge(b.lane)}<div class="boatname">${esc(b.name)} <span class="grade">${esc(b.grade)}</span><small>${esc(b.registrationNumber||'DEMO')} / ${b.course}コース</small></div><div class="boatstat">${b.win.toFixed(2)}<small>勝率</small></div><div class="boatstat">${b.motor.toFixed(1)}<small>M2連%</small></div><div class="boatstat">${b.exhibit.toFixed(2)}<small>展示</small></div></div>`).join('')}</div><details style="margin-top:9px"><summary>詳細出走表</summary><div class="tablewrap"><table><thead><tr><th>艇</th><th>平均ST</th><th>展示ST</th><th>当地勝率</th><th>F</th><th>モーター</th></tr></thead><tbody>${race.boats.map(b=>`<tr><td>${b.lane}</td><td>${esc(b.averageST)}</td><td>${esc(b.st)}</td><td>${esc(b.localWin)}</td><td>${esc(b.flyingCount)}</td><td>${esc(b.motorNumber)}</td></tr>`).join('')}</tbody></table></div></details>`}
function techniqueProb(dist){let w=marg(dist).map(a=>a[0]),profiles=[[.94,.01,.01,.01,.03],[0,.65,.23,.08,.04],[0,.25,.42,.28,.05],[0,.17,.46,.31,.06],[0,.14,.30,.47,.09],[0,.12,.23,.50,.15]],names=['逃げ','差し','まくり','まくり差し','抜き'];return names.map((k,j)=>[k,sum(w.map((p,i)=>p*profiles[i][j]))]).sort((a,b)=>b[1]-a[1])}function turnMap(order,boats){return `<svg viewBox="0 0 330 152" width="100%" role="img" aria-label="第1ターンマークの仮説展開図"><rect width="330" height="152" rx="12" fill="#0a4760"/><path d="M8 130 Q205 130 270 50 Q295 12 327 36" stroke="#8bccdc" stroke-width="2" stroke-dasharray="5 5" fill="none"/><circle cx="272" cy="62" r="10" fill="#e9b65f"/><text x="253" y="43" fill="white" font-size="11">1M</text>${order.map((n,i)=>{let x=246-i*36,y=76+i*10;return `<path d="M${x-15} ${y+5} L${x-34} ${y+8}" stroke="#bbebf3" opacity=".6" stroke-width="2"/><circle cx="${x}" cy="${y}" r="13" fill="${COLORS[n-1]}"/><text x="${x}" y="${y+4}" font-size="12" font-weight="bold" fill="${n===1||n===5?'#111':'#fff'}" text-anchor="middle">${n}</text>`}).join('')}</svg><div class="row" style="margin-top:8px">${boats.slice().sort((a,b)=>a.course-b.course).map(b=>`<span class="tag">${b.lane}艇 ST ${esc(b.st||'—')}</span>`).join('')}</div>`}function modelPanel(reveal){if(!reveal)return `<div class="panel"><h2>AI予想</h2><div class="notice">独立検証モード：投票・見送り確定後に公開します。</div></div>`;let e=experimental(race),base=race.baseline;let m=currentModel==='base'&&base?base:e,d=marg(m.distribution),top=m.distribution[0],odds=market(race,tick).trifecta;let f=e.details;return `<div class="panel"><div class="between"><h2>AI分析</h2><span class="tag">${esc(m.id)}</span></div><div class="row">${btn('実験モデル','model:exp',currentModel==='exp'?'selected':'')}${btn('既存V4（保存予測）','model:base',currentModel==='base'?'selected':'',!base)}</div><p class="sub">${currentModel==='base'&&base?'締切前の保存予測をそのまま表示':'説明可能な仮説モデル / 未検証・研究用'}</p><div class="between"><strong>本命 ${esc(top[0])}</strong><span class="accent">${pct(top[1])}</span></div><div class="model-line"><span>艇</span><span>1着</span><span>2着</span><span>3着</span></div>${d.map((v,i)=>`<div class="model-line">${badge(i+1)}${v.map(x=>`<div>${pct(x)}<div class="chartbar"><i style="width:${x*100}%"></i></div></div>`).join('')}</div>`).join('')}<details id="evDetails"><summary>3連単120通り・期待値</summary><div class="tablewrap"><table><thead><tr><th>買い目</th><th>確率</th><th>オッズ</th><th>期待回収倍率</th></tr></thead><tbody>${m.distribution.map(([k,p])=>`<tr><td>${k}</td><td>${pct(p)}</td><td data-market-key="${k}">${odds?.[k]?.toFixed(1)??'—'}</td><td data-ev-key="${k}" data-prob="${p}">${odds?.[k]?(p*odds[k]).toFixed(2):'—'}</td></tr>`).join('')}</tbody></table></div></details><details><summary>実験モデルの予測要因</summary><div class="tablewrap"><table><thead><tr><th>艇</th><th>コース</th><th>勝率</th><th>モーター</th><th>展示</th><th>ST</th><th>当地</th><th>風</th></tr></thead><tbody>${f.map((x,i)=>`<tr><td>${i+1}</td>${Object.values(x).map(v=>`<td>${v>=0?'+':''}${v.toFixed(2)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="sub">実験モデルの対数スコア寄与。既存V4の内部要因とは異なります。</p></details><div class="panel" style="margin-bottom:0"><h3>第1ターンマーク予測</h3>${turnMap(e.firstMark,race.boats)}<p class="sub">展開の仮説順序と展示ST。実在レースの第1M実測は未収録。</p><div class="row">${techniqueProb(e.distribution).map(([k,p])=>`<span class="tag">${k} ${pct(p)}</span>`).join('')}</div><p class="tiny muted">決まり手は仮説上の確率であり、未検証です。</p></div></div>`}
function openRace(i){let all=racesDay().filter(r=>!s.processed.includes(r.id));race=all[i];if(!race)return;tickets=[];tick=0;selectedType='trifecta';betMethod='normal';uniformAmount='100';individual=false;resetSelection();currentModel='exp';pred={};raceView()}
function totalBet(){return sum(tickets.map(t=>t.amount))}function availableOdds(){return market(race,tick)}
function supportedMethods(){return TYPES[selectedType][1]===1?['normal','odds']:Object.keys(METHODS)}
function resetSelection(){if(!supportedMethods().includes(betMethod))betMethod='normal';let n=betMethod==='box'?1:TYPES[selectedType][1];groups=Array.from({length:n},()=>betMethod==='flow'?[...N]:[]);oddsKeys=new Set;individualAmounts={};let od=race?availableOdds()[selectedType]:null;oddsOrder=[...COMBOS[selectedType]].sort((a,b)=>(od?.[a]??Infinity)-(od?.[b]??Infinity));}
function draftKeys(){return expandBets(selectedType,betMethod,groups,[...oddsKeys])}
function draftItems(){return draftKeys().map(key=>({type:selectedType,key,amount:Number(individual?(individualAmounts[key]??uniformAmount):uniformAmount)}))}
function cartInputsValid(){return Array.from(document.querySelectorAll('[data-cart-amount]')).every(el=>{let t=tickets[+el.dataset.cartAmount];return t&&validBetAmount(Number(el.value))&&Number(el.value)===t.amount})}
function draftValid(items){return cartInputsValid()&&items.length>0&&items.every(t=>validBetAmount(t.amount)||(individual&&t.amount===0))&&items.some(t=>t.amount>0)&&totalBet()+sum(items.map(t=>t.amount))<=s.wallet}
function quote(type,key){return `<span data-quote-type="${type}" data-quote-key="${key}">—</span>`}
function labelsForGroups(){if(betMethod==='box')return ['選択'];let n=TYPES[selectedType][1];if(n===1)return ['選択'];return Array.from({length:n},(_,i)=>TYPES[selectedType][2]?`${i+1}着`:`${i+1}組`)}
function selectionHTML(){
  if(betMethod==='odds')return `<p class="sub">オッズ一覧から買い目を複数選択できます。並び順は表示開始時点で固定しています。</p><div class="bet-odds-list">${oddsOrder.map(key=>`<button type="button" data-action="odds-select:${key}" aria-pressed="${oddsKeys.has(key)}" aria-label="買い目 ${key}"><span>${oddsKeys.has(key)?'✓　':'＋　'}${key}</span><span>${quote(selectedType,key)}</span></button>`).join('')}</div>`;
  let labels=labelsForGroups(),allowAll=['formation','box','flow'].includes(betMethod),help={normal:'各列から1艇ずつ選択してください。',formation:'各列で複数艇を選択できます。同じ艇が重なる組番は除外します。',box:'選んだ艇の全ての組み合わせを作成します。',flow:'固定する列で1艇を選択し、流す列は「全」を選択します。'};
  return `<p class="sub">${help[betMethod]}</p><div class="bet-matrix" style="grid-template-columns:minmax(86px,1.7fr) repeat(${labels.length},minmax(38px,1fr))"><div class="bet-matrix-head" style="text-align:left">艇番 / 選手</div>${labels.map(label=>`<div class="bet-matrix-head">${label}</div>`).join('')}${race.boats.map(b=>`<div class="bet-name">${badge(b.lane)}<span>${esc(b.name)}</span></div>${labels.map((label,i)=>`<button type="button" class="bet-pick" aria-label="${label} ${b.lane}号艇" aria-pressed="${groups[i]?.includes(b.lane)||false}" data-action="pick:${i}:${b.lane}">${b.lane}</button>`).join('')}`).join('')}${allowAll?`<div class="bet-matrix-head" style="text-align:left">一括選択</div>${labels.map((label,i)=>`<button type="button" data-all="true" class="bet-pick" aria-label="${label} 全艇" aria-pressed="${groups[i]?.length===6}" data-action="all:${i}">全</button>`).join('')}`:''}</div>`;
}
function buyPanel(){return `<div class="panel" id="betPanel"><div class="between"><h2>舟券投票</h2><span id="oddsFlag" class="tag">${race.sim?'オッズ変動中':'保存オッズ'}</span></div>${race.sim?'':'<p class="sub">3連単以外の締切前オッズは未保存。購入可能ですが払戻はアーカイブ確定値で精算します。</p>'}<label for="type">券種</label><select id="type">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${k===selectedType?'selected':''}>${v[0]}</option>`).join('')}</select><div id="methodPicker" class="bet-methods"></div><div id="selectionUI"></div><div class="between"><strong>選択した買い目</strong>${btn('選択解除','clear-selection')}</div><div class="bet-amount"><div class="field"><label for="amount">1点の購入額（円）</label><input id="amount" type="number" value="100" min="100" step="100" inputmode="numeric"></div><label class="bet-check"><input id="individual" type="checkbox">個別金額設定</label></div><div class="row" style="margin-top:8px">${[100,500,1000,5000].map(v=>btn(yen(v),'quick-amount:'+v)).join('')}</div><div id="draftList"></div><div class="bet-tally"><span id="draftCount">0点</span><strong id="draftTotal">0円</strong></div><div class="row">${btn('ベットリストに追加','add','primary',true)}</div><p id="draftWarning" class="sub"></p><div style="border-top:1px solid var(--line);margin:16px 0 12px"></div><div class="between"><h3>ベットリスト</h3><span class="tag" id="cartCount">0点</span></div><div id="ticketList" class="bet-cart"></div><p id="cartWarning" class="sub warn"></p><div class="bet-total" style="margin-top:10px"><div class="between"><span>購入合計</span><strong id="cartTotal" class="grand">0円</strong></div><div class="between"><span>投票後の所持金</span><strong id="cartRemaining">${yen(s.wallet)}</strong></div></div><details id="oddsDetails" style="margin-top:12px"><summary>オッズ一覧（選択券種）</summary><div id="oddsTable" class="tablewrap"></div></details></div>`}
function renderDraft(){let keys=draftKeys(),el=document.getElementById('draftList');if(!el)return;if(!keys.length){el.innerHTML='<p class="sub">有効な買い目ができるように艇番を選択してください。</p>';return}el.innerHTML=`<div class="bet-preview"><table><thead><tr><th>買い目</th><th>オッズ</th><th>${individual?'金額（円）':'1点あたり'}</th></tr></thead><tbody>${keys.map(k=>`<tr><td><b>${k}</b></td><td>${quote(selectedType,k)}</td><td>${individual?`<input type="number" min="0" step="100" inputmode="numeric" data-draft-amount="${k}" aria-label="${k} 購入金額" value="${esc(individualAmounts[k]??uniformAmount)}">`:`<span data-uniform-quote>${yen(Number(uniformAmount)||0)}</span>`}</td></tr>`).join('')}</tbody></table></div>`}
function renderSelection(){let scroll=document.querySelector('.bet-odds-list')?.scrollTop||0;document.getElementById('methodPicker').innerHTML=supportedMethods().map(k=>`<button type="button" data-action="bet-method:${k}" aria-pressed="${betMethod===k}" class="${betMethod===k?'selected':''}">${METHODS[k]}</button>`).join('');document.getElementById('selectionUI').innerHTML=selectionHTML();let oddsList=document.querySelector('.bet-odds-list');if(oddsList)oddsList.scrollTop=scroll;document.getElementById('amount').value=uniformAmount;document.getElementById('amount').disabled=individual;document.getElementById('individual').checked=individual;renderDraft();syncOdds()}
function pickLane(i,lane){if(!groups[i]||!N.includes(lane))return;if(betMethod==='normal'||betMethod==='flow'){if(groups[i].length===1&&groups[i][0]===lane)groups[i]=betMethod==='flow'?[...N]:[];else{groups[i]=[lane];for(let j=0;j<groups.length;j++)if(j!==i&&groups[j].length===1&&groups[j][0]===lane)groups[j]=betMethod==='flow'?[...N]:[]}}else{groups[i]=groups[i].includes(lane)?groups[i].filter(x=>x!==lane):[...groups[i],lane]}renderSelection()}
function renderCart(){let el=document.getElementById('ticketList');if(!el)return;el.innerHTML=tickets.length?tickets.map((t,i)=>`<div class="bet-cart-row"><div><b>${TYPES[t.type][0]} ${t.key}</b><span class="sub">${quote(t.type,t.key)}</span></div><input type="number" min="100" step="100" inputmode="numeric" aria-label="${TYPES[t.type][0]} ${t.key} 金額" data-cart-amount="${i}" value="${t.amount}">${btn('削除','remove:'+i)}</div>`).join(''):'<p class="sub">まだ買い目が追加されていません。</p>'}
function predPanel(){return `<div class="panel"><details><summary>プレイヤー予想記録（任意）</summary><p class="sub">投票とは独立して記録できます。</p><div class="row"><div class="field"><label>3連単着順</label><select id="prediction"><option value="">未入力</option>${COMBOS.trifecta.map(k=>`<option ${pred.finish===k?'selected':''}>${k}</option>`).join('')}</select></div><div class="field"><label>決まり手</label><select id="technique"><option value="">未入力</option>${['逃げ','差し','まくり','まくり差し','抜き','恵まれ'].map(k=>`<option ${pred.technique===k?'selected':''}>${k}</option>`).join('')}</select></div><div class="field"><label>第1M先頭艇</label><select id="firstMark"><option value="">未入力</option>${N.map(k=>`<option ${String(pred.firstMark)===String(k)?'selected':''}>${k}</option>`).join('')}</select></div></div><label>予想メモ</label><textarea id="memo" maxlength="300" rows="2" style="width:100%">${esc(pred.memo||'')}</textarea></details></div>`}
function raceView(){screen('race',raceHeader()+`<div class="split" style="margin-top:12px"><div class="panel"><h2>出走表・展示</h2>${boatTable()}</div><div id="modelBox">${modelPanel(s.mode==='assist')}</div></div>`+buyPanel()+predPanel(),btn('見送り','skip')+btn('投票確定・レース開始','commit','primary',!tickets.length));renderCart();renderSelection();if(race.sim)interval=setInterval(()=>{tick++;syncOdds()},2200)}
function syncOdds(){if(view!=='race'||!document.getElementById('betPanel'))return;let odds=availableOdds(),items=draftItems(),positive=items.filter(t=>t.amount>0),draftSum=sum(items.map(t=>t.amount)),valid=draftValid(items);document.querySelectorAll('[data-quote-key]').forEach(el=>{let v=odds[el.dataset.quoteType]?.[el.dataset.quoteKey];el.textContent=Number.isFinite(v)?v.toFixed(1)+'倍':'未保存'});document.querySelectorAll('[data-uniform-quote]').forEach(el=>el.textContent=yen(Number(uniformAmount)||0));document.getElementById('draftCount').textContent=`${individual?positive.length:items.length}点`;document.getElementById('draftTotal').textContent=Number.isFinite(draftSum)?yen(draftSum):'—';document.getElementById('draftWarning').textContent=items.length&&!valid?'100円単位・残高以内で金額を指定してください。':'';document.querySelector('[data-action="add"]').disabled=!valid;document.getElementById('cartWarning').textContent=cartInputsValid()?'':'ベットリストの金額を100円単位・残高以内で入力してください。';document.getElementById('cartCount').textContent=tickets.length+'点';document.getElementById('cartTotal').textContent=yen(totalBet());document.getElementById('cartRemaining').textContent=yen(s.wallet-totalBet());let od=odds[selectedType];if(document.getElementById('oddsDetails')?.open)document.getElementById('oddsTable').innerHTML=od?`<table><thead><tr><th>買い目</th><th>オッズ</th></tr></thead><tbody>${Object.entries(od).sort((a,b)=>a[1]-b[1]).map(([k,v])=>`<tr><td>${k}</td><td>${v.toFixed(1)}</td></tr>`).join('')}</tbody></table>`:'<p class="sub">オッズ未保存</p>';if(document.getElementById('evDetails')?.open){document.querySelectorAll('[data-market-key]').forEach(el=>el.textContent=odds.trifecta?.[el.dataset.marketKey]?.toFixed(1)??'—');document.querySelectorAll('[data-ev-key]').forEach(el=>{let x=odds.trifecta?.[el.dataset.evKey];el.textContent=x?(x*Number(el.dataset.prob)).toFixed(2):'—'})}let c=bar.querySelector('[data-action="commit"]');if(c)c.disabled=!tickets.length||totalBet()>s.wallet||!cartInputsValid()}
function addTicket(){let items=draftItems();if(!draftValid(items))return notify('100円単位・所持金以内で入力してください');let added=items.filter(t=>t.amount>0);tickets=mergeTickets(tickets,added,s.wallet);notify(`${added.length}点を追加しました`);resetSelection();renderCart();renderSelection()}
function lock(r,participation,ts=[],p={},od=market(r,0)){let exp=experimental(r),models=[exp,...(r.baseline?[r.baseline]:[])],result=outcome(r),pay=payoutMaps(r,result,od),stake=sum(ts.map(x=>x.amount)),ret=settle(ts,pay);if(stake>s.wallet)throw Error('残高不足');s.wallet+=ret-stake;drawdown(s);let log={id:r.id,day:s.day,venue:r.venue,no:r.no,kind:s.kind,mode:s.mode,status:participation,stake,return:ret,pnl:ret-stake,finish:result.finish,technique:result.technique,firstMark:result.firstMark,engineVersion:result.engineVersion,generatedSplits:result.splits||null,actualST:result.actualST,player:p,tickets:ts.map(t=>({...t,odds:od[t.type]?.[t.key]??null,return:(pay[t.type]?.[t.key]||0)*(t.amount/100)})),models:models.map(m=>({id:m.id,distribution:m.distribution,top:m.distribution[0][0],brier:brier(m.distribution,result.finish),firstMark:m.firstMark||null})),capturedBeforeReveal:true,lockedAt:new Date().toISOString(),oddsAt:r.sim?'simulated':r.oddsAt,source:r.sim?'generated':r.provenance};s.logs.push(log);s.processed.push(r.id);s.clock=Math.max(s.clock,r.minute);return {result,pay,log,models}}
function processEarlier(r){for(let x of racesDay())if(!s.processed.includes(x.id)&&x.minute<r.minute)lock(x,'auto-skip')}
function commit(skip){if(!race||s.processed.includes(race.id))return;let stake=totalBet();if(!skip&&(!stake||stake>s.wallet||!cartInputsValid()))return notify('舟券を追加してください');processEarlier(race);lastResult=lock(race,skip?'skip':'bet',skip?[]:tickets,{...pred},availableOdds());tickets=[];persist();resultView(true)}
function raceDetails(z){

function breakdown(logs){let venue=new Map,types=new Map;for(let x of logs){if(x.status!=='bet')continue;let a=venue.get(x.venue)||{n:0,stake:0,ret:0};a.n++;a.stake+=x.stake;a.ret+=x.return;venue.set(x.venue,a);for(let t of x.tickets){let v=types.get(t.type)||{n:0,stake:0,ret:0,missing:false};v.n++;v.stake+=t.amount;if(t.return==null)v.missing=true;else v.ret+=t.return;types.set(t.type,v)}}let tbl=(rows)=>`<div class="tablewrap"><table><thead><tr><th>分類</th><th>件数</th><th>購入</th><th>回収率</th></tr></thead><tbody>${rows.map(([k,v])=>`<tr><td>${k}</td><td>${v.n}</td><td>${yen(v.stake)}</td><td>${v.missing?'—':pct(v.ret/v.stake)}</td></tr>`).join('')}</tbody></table></div>`;let chosen=logs.filter(x=>x.status==='bet'),skip=logs.filter(x=>x.status!=='bet'),hit=x=>x.models[0]?.top===x.finish.slice(0,3).join('-');return `<details><summary>競艇場別・券種別・選別分析</summary><h3>競艇場別</h3>${tbl([...venue].map(([k,v])=>[VENUES[k],v]))}<h3>券種別</h3>${tbl([...types].map(([k,v])=>[TYPES[k][0],v]))}<h3>参加・非参加の実験モデル的中率</h3><p>参加 ${chosen.length?pct(chosen.filter(hit).length/chosen.length):'—'}（${chosen.length}R） / 非参加 ${skip.length?pct(skip.filter(hit).length/skip.length):'—'}（${skip.length}R）</p></details>`}function analytics(){let states=s?[s]:Object.values(saves),entries=states.flatMap(a=>a.logs),groups=Object.entries(saves);let html=`<div class="hero"><h1>戦績・研究</h1><p class="sub">架空・実在、実戦・独立検証を区別して集計します。</p></div>`;for(let [k,a] of groups){if(s&&a!==s)continue;let logs=a.logs,bets=logs.filter(x=>x.status==='bet'),stake=sum(bets.map(x=>x.stake)),ret=sum(bets.map(x=>x.return)),hits=bets.filter(x=>x.return>0).length;let ms=new Map;for(let x of logs)for(let m of x.models){let generator=x.engineVersion||(x.kind==='sim'?'LEGACY-0.2':'ARCHIVE'),group=m.id+' / '+generator,row=ms.get(group)||{n:0,hit:0,b:0};row.n++;row.hit+=m.top===x.finish.slice(0,3).join('-')?1:0;row.b+=m.brier;ms.set(group,row)}let player=logs.filter(x=>x.player?.finish),first=logs.filter(x=>x.player?.firstMark&&x.firstMark);html+=`<div class="panel"><h2>${k.includes('assist')?'実戦':'独立検証'} / ${k.includes('sim')?'架空':'実在'}</h2><div class="metrics"><div class="metric"><span>参加</span><strong>${bets.length}R</strong></div><div class="metric"><span>的中率</span><strong>${bets.length?pct(hits/bets.length):'—'}</strong></div><div class="metric"><span>回収率</span><strong>${stake?pct(ret/stake):'—'}</strong></div><div class="metric"><span>見送り・未選択</span><strong>${logs.length-bets.length}R</strong></div><div class="metric"><span>最大DD</span><strong>${yen(a.drawdown)}</strong></div><div class="metric"><span>舟券収支</span><strong>${yen(ret-stake)}</strong></div></div><p class="sub">プレイヤー3連単予想 ${player.length}件・的中 ${player.filter(x=>x.player.finish===x.finish.slice(0,3).join('-')).length}件 / 第1M検証 ${first.length}件・的中 ${first.filter(x=>Number(x.player.firstMark)===x.firstMark[0]).length}件</p><div class="tablewrap"><table><thead><tr><th>モデル / 生成方式</th><th>対象</th><th>3連単1位的中</th><th>1着 Brier</th></tr></thead><tbody>${[...ms].map(([id,m])=>`<tr><td>${esc(id)}</td><td>${m.n}</td><td>${pct(m.hit/m.n)}</td><td>${(m.b/m.n).toFixed(4)}</td></tr>`).join('')}</tbody></table></div>${breakdown(logs)}<details><summary>履歴・最新100件</summary><div class="tablewrap"><table><thead><tr><th>日</th><th>レース</th><th>参加</th><th>結果</th><th>収支</th></tr></thead><tbody>${logs.slice(-100).reverse().map(x=>`<tr><td>${x.day}</td><td>${VENUES[x.venue]} ${x.no}R</td><td>${x.status==='bet'?'購入':x.status==='skip'?'見送り':'未選択'}</td><td>${x.finish.slice(0,3).join('-')}</td><td>${yen(x.pnl)}</td></tr>`).join('')}</tbody></table></div></details></div>`}if(!entries.length)html+='<p class="sub">まだ記録がありません。</p>';screen('stats',html+`<div class="panel"><h2>研究データ</h2><div class="row">${btn('CSV出力','csv')}${btn('JSON出力','research')}</div><p class="sub">結果公開前に確定した予想分布、買い目、モード、モデルID、実データ出典を保存します。ブラウザ内のクライアント保存であり改ざん耐性はありません。</p></div>`,btn(s?'レース一覧へ':'ホーム','back','primary'))}
function download(name,data,mime='application/json'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportSave(){download('boat-simulator-save.json',JSON.stringify({schema:'boat-simulator-save-v1',saves},null,2))}
function exportResearch(csv){let logs=(s?[s]:Object.values(saves)).flatMap(x=>x.logs);if(!csv)return download('boat-research.json',JSON.stringify(logs));let header=['id','mode','kind','day','venue','race_no','status','stake','return','pnl','finish','player_prediction','model_ids','top_predictions','brier','generator_version','first_mark','generated_splits'];let content=[header,...logs.map(x=>[x.id,x.mode,x.kind,x.day,x.venue,x.no,x.status,x.stake,x.return,x.pnl,x.finish.join('-'),x.player?.finish||'',x.models.map(m=>m.id).join('|'),x.models.map(m=>m.top).join('|'),x.models.map(m=>m.brier).join('|'),x.engineVersion||(x.kind==='sim'?'LEGACY-0.2':'ARCHIVE'),x.firstMark?.join('-')||'',x.generatedSplits?JSON.stringify(x.generatedSplits):''])].map(a=>a.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n');download('boat-research.csv','\ufeff'+content,'text/csv;charset=utf-8')}
document.getElementById('homeBtn').onclick=()=>home();document.getElementById('statsBtn').onclick=()=>analytics();
document.addEventListener('toggle',e=>{if(['evDetails','oddsDetails'].includes(e.target.id)&&e.target.open)syncOdds()},true);
document.addEventListener('change',e=>{let t=e.target,id=t.id;if(id==='type'&&TYPES[t.value]){selectedType=t.value;resetSelection();renderSelection()}else if(id==='individual'){individual=t.checked;renderSelection()}else if(id==='prediction')pred.finish=t.value;else if(id==='technique')pred.technique=t.value;else if(id==='firstMark')pred.firstMark=t.value;else if(t.dataset.cartAmount!==undefined){let index=Number(t.dataset.cartAmount),line=tickets[index],amount=Number(t.value);if(!line)return;if(!validBetAmount(amount)||totalBet()-line.amount+amount>s.wallet){t.value=line.amount;notify('100円単位・所持金以内で入力してください')}else line.amount=amount;t.removeAttribute('aria-invalid');syncOdds()}});
document.addEventListener('input',e=>{let t=e.target;if(t.id==='memo')pred.memo=t.value;else if(t.id==='amount'){uniformAmount=t.value;syncOdds()}else if(t.dataset.draftAmount!==undefined){individualAmounts[t.dataset.draftAmount]=t.value;syncOdds()}else if(t.dataset.cartAmount!==undefined){let line=tickets[+t.dataset.cartAmount],amount=Number(t.value);if(line&&validBetAmount(amount)&&totalBet()-line.amount+amount<=s.wallet){line.amount=amount;t.removeAttribute('aria-invalid')}else t.setAttribute('aria-invalid','true');syncOdds()}});
document.getElementById('dataFile').onchange=async e=>{try{let d=validatePack(JSON.parse(await e.target.files[0].text()));if(Object.values(saves).some(x=>x.kind==='real'&&x.logs.length)&&pack&&JSON.stringify(pack.races.map(x=>x.id))!==JSON.stringify(d.races.map(x=>x.id)))throw Error('実在プレイ途中のデータ差し替えは未対応です。セーブを保存してください。');localStorage.setItem(KEY+'-data',JSON.stringify(d));pack=d;notify(`${d.races.length}レース・${d.profiles.length}選手を読み込みました`);home()}catch(err){notify(err.message)}e.target.value=''};
document.getElementById('saveFile').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(d.schema!=='boat-simulator-save-v1'||!d.saves||Object.entries(d.saves).some(([k,v])=>!['assist-sim','blind-sim','assist-real','blind-real'].includes(k)||v.version!==1||k!==v.mode+'-'+v.kind||!Number.isFinite(v.wallet)||!Number.isFinite(v.debt)||!Array.isArray(v.logs)||!Array.isArray(v.processed)||!Array.isArray(v.days)||!(v.difficulty in COST)||!Number.isInteger(v.day)))throw Error('セーブ形式が違います');if(!confirm('現在のセーブを読み込むファイルで置き換えますか？'))return;s=null;saves=d.saves;persist();home();notify('セーブ読み込み完了')}catch(err){notify(err.message)}finally{e.target.value=''}};
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(!el||el.disabled)return;let [a,b,c]=el.dataset.action.split(':');try{switch(a){case'home':home();break;case'start':start(b,c);break;case'lobby':lobby();break;case'back':s?lobby():home();break;case'race':openRace(+b);break;case'model':currentModel=b;if(view==='race')document.getElementById('modelBox').innerHTML=modelPanel(s.mode==='assist');else if(view==='result')resultView(false);break;case'bet-method':if(supportedMethods().includes(b)&&b!==betMethod){betMethod=b;resetSelection();renderSelection()}break;case'pick':pickLane(+b,+c);break;case'all':if(groups[+b]){groups[+b]=betMethod==='flow'||groups[+b].length!==6?[...N]:[];renderSelection()}break;case'odds-select':if(COMBOS[selectedType].includes(b)){oddsKeys.has(b)?oddsKeys.delete(b):oddsKeys.add(b);renderSelection()}break;case'clear-selection':resetSelection();renderSelection();break;case'quick-amount':uniformAmount=b;if(individual)for(let k of draftKeys())individualAmounts[k]=b;renderSelection();break;case'add':addTicket();break;case'remove':tickets.splice(+b,1);renderCart();syncOdds();break;case'commit':commit(false);break;case'skip':commit(true);break;case'showResult':resultView(false);break;case'sleep':sleep();break;case'borrow':if(borrow(s)){persist();lobby()}break;case'repay':if(repay(s)){persist();lobby()}break;case'stats':analytics();break;case'data':document.getElementById('dataFile').click();break;case'export':exportSave();break;case'import':document.getElementById('saveFile').click();break;case'csv':exportResearch(true);break;case'research':exportResearch(false);break;case'reset':if(confirm('現在のゲームをリセットしますか？研究記録は事前にエクスポートしてください。')){let old=s;s=newState(old.mode,old.kind,old.difficulty);if(s.kind==='sim'){s.profiles=pack?.profiles||null;s.venueProfiles=pack?.venueProfiles||{}}persist();lobby()}break}}catch(err){notify('処理できません：'+err.message)}});
function boot(){app.innerHTML='<div class="panel">セーブを読み込み中…</div>';if(!window.indexedDB)return home();try{let req=indexedDB.open(KEY,1);req.onupgradeneeded=()=>req.result.createObjectStore('save');req.onerror=()=>home();req.onblocked=()=>home();req.onsuccess=()=>{db=req.result;let q=db.transaction('save','readonly').objectStore('save').get('state');q.onsuccess=()=>{if(q.result&&typeof q.result==='object')saves=q.result;else persist();home()};q.onerror=()=>home()}}catch(e){home()}}
boot();
}
</script></body></html>
